<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compass X — Unified Access Management prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2B2D31;--navy:#02324C;--navy2:#194566;--navy3:#29587C;--red:#83181E;--red2:#E00223;--blue:#1572C5;--blue-dark:#0E5AA0;--blue-tint:#E1F1FF;--blue-line:#B6D7F2;
  --green:#048037;--green-tint:#C3E7CC;--green-text:#0B5A2A;--orange:#CC3600;--orange-tint:#FBE9E7;--yellow-tint:#FFF6D6;--yellow-text:#7A4A00;--yellow-line:#F2DE9A;
  --page:#FFFFFF;--card:#FFFFFF;--surface:#F3F4F6;--chip:#E5E7EB;--line:#DFDFDF;--line2:#C9CDD2;--muted:#5F6B7A;--faint:#9AA3B2;--grayfill:#606773;
  --nav:#02324C;--nav-hi:#83181E;--nav-text:#E6EEF5;--nav-dim:#9FB3C4;--nav-div:rgba(255,255,255,.14);
  --outer:#E9ECEF;--outer-text:#2B2D31;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--outer:#0B1A26;--outer-text:#E6EEF5;color-scheme:dark}
}
:root[data-theme="dark"]{--outer:#0B1A26;--outer-text:#E6EEF5}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--outer);color:var(--outer-text);font-family:Quicksand,'Segoe UI',Arial,sans-serif;font-size:14px;line-height:1.45;font-weight:500}
button,input,select,textarea{font:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
a{color:var(--blue)}a:hover{color:var(--blue-dark)}
h1,h2,h3,h4,p{margin:0}
#app{min-height:100%;color-scheme:light;color:var(--ink)}
.app{min-height:100%;display:flex;flex-direction:column;background:var(--page)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
code.k{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--chip);padding:1px 6px;border-radius:4px}
.muted{color:var(--muted)}.small{font-size:12px}.b{font-weight:600}
/* buttons — pills; default = outlined blue (drawer context), light = grey toolbar, red = page primary, primary = blue */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;border:1px solid var(--blue);background:#fff;color:var(--blue);font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--blue-tint)}
.btn-light{border:1px solid var(--surface);background:var(--surface);color:var(--ink)}
.btn-light:hover{background:var(--chip)}
.btn-red{border:0;background:var(--red);color:#fff;font-weight:600;padding:0 22px}
.btn-red:hover{background:#6E1419}
.btn-primary{border:0;background:var(--blue);color:#fff;font-weight:600;padding:0 22px}
.btn-primary:hover{background:var(--blue-dark)}
.btn-danger{border:0;background:var(--red);color:#fff;font-weight:600;padding:0 22px}
.btn-danger:hover{background:#6E1419}
.btn-link{border:0;background:transparent;color:var(--blue);padding:0 4px;height:auto;border-radius:0}
.btn-icon{width:36px;height:36px;padding:0;border-color:var(--line2);color:var(--ink)}
.btn-full{width:100%}
.btn[disabled]{cursor:not-allowed;color:var(--faint);background:var(--surface);border-color:var(--surface)}
.btn-primary[disabled],.btn-red[disabled]{background:#AFC9E3;color:#fff}
.btn.focus,.focus{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--blue)}
.btn.sm{height:34px;font-size:13px;padding:0 14px}
/* pills — Compass status labels */
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:96px;height:22px;padding:0 10px;border-radius:3px;font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.pill-teal{background:var(--green);color:#fff}
.pill-info{background:var(--green-tint);color:var(--green-text)}
.pill-amber{background:var(--yellow-tint);color:var(--yellow-text)}
.pill-light{background:#E8E9EB;color:var(--ink)}
.pill-red{background:var(--orange);color:#fff}
.pill-redline{background:#fff;border:1px solid var(--orange);color:var(--orange)}
.pill-gray{background:var(--grayfill);color:#fff}
.pill-greenline{background:#fff;border:1px solid var(--green);color:var(--green)}
.pill-outline{background:#fff;border:1px solid var(--line2);color:var(--muted)}
.pill-ink{background:var(--navy2);color:#fff;text-transform:none;letter-spacing:0;font-size:14px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:4px;background:var(--chip);color:var(--ink);font-size:13px;font-weight:500}
.chip.struck{background:transparent;color:var(--muted);text-decoration:line-through;font-weight:400;padding:0 4px}
.chip .x{display:inline-flex;border:0;background:transparent;padding:0;cursor:pointer;color:inherit}
.syschip{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:3px;background:var(--blue-tint);color:var(--navy2);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.lvl{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:3px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.lvl-View{background:transparent;color:var(--blue)}.lvl-Manage{background:#fff;border:1px solid var(--blue);color:var(--blue)}.lvl-Control{background:var(--blue-tint);color:var(--navy2)}.lvl-Process{background:var(--navy3);color:#fff}
.dot{display:inline-block;width:10px;height:10px;border-radius:999px}
.dot-set{background:var(--blue)}.dot-unset{background:#C7C9CB}.dot-bad{background:var(--orange)}
.count{display:inline-flex;align-items:center;height:20px;padding:0 10px;border-radius:999px;background:var(--navy3);color:#fff;font-size:11px;font-weight:700}
/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lbl{font-size:12px;font-weight:500;color:var(--muted)}
.req{color:var(--orange)}
.help{font-size:12px;color:var(--muted)}
.input,.select,.textarea{height:40px;width:100%;border:1px solid var(--line2);border-radius:6px;padding:0 12px;background:#fff;color:var(--ink);font-weight:500}
.input.sm,.select.sm{height:36px}
.textarea{height:auto;min-height:88px;padding:10px 12px;resize:vertical}
.input.err{border-color:var(--orange)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:700px){.grid2{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid var(--blue);border-radius:4px;overflow:hidden}
.seg button{height:40px;padding:0 16px;border:0;background:#fff;color:var(--blue);font-weight:600;cursor:pointer;border-left:1px solid var(--blue)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--navy2);color:#fff}
.cbchip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 8px;border-radius:4px;cursor:pointer;background:var(--chip);border:1px solid var(--chip);font-weight:500}
.cbchip.on{background:var(--navy2);border-color:var(--navy2);color:#fff}
.cbchip input,.cbrow input{width:16px;height:16px;margin:0;accent-color:var(--navy2)}
.cbrow{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.switch{display:inline-flex;align-items:center;gap:10px;border:0;background:transparent;padding:0;cursor:pointer;font-weight:600;color:var(--ink)}
.switch .track{position:relative;display:inline-block;width:40px;height:24px;border-radius:999px;background:#C9CDD2}
.switch[aria-checked="true"] .track{background:var(--blue)}
.switch .knob{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:999px;background:#fff;transition:left .15s}
.switch[aria-checked="true"] .knob{left:19px}
.switch[aria-checked="false"]{color:var(--muted)}
/* layout */
.topbar{min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 24px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08);position:relative;z-index:2;padding-top:env(safe-area-inset-top,0px)}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy);font-size:19px;font-weight:700;letter-spacing:.02em;border:0;background:transparent;cursor:pointer;text-transform:uppercase}
.body{display:flex;flex:1 1 auto;min-height:0}
nav.side{flex:0 0 232px;background:var(--nav);color:#fff;display:flex;flex-direction:column;padding:16px 12px 20px;gap:4px}
.firmcard{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:#fff;border:0;border-radius:6px;padding:10px 12px;margin-bottom:12px;color:var(--ink);cursor:default}
.navitem{display:flex;align-items:center;gap:12px;min-height:42px;padding:8px 10px;border-radius:4px;color:var(--nav-text);text-decoration:none;font-weight:500;font-size:15px;border:0;background:transparent;width:100%;text-align:left;cursor:pointer}
.navitem:hover{background:rgba(255,255,255,.06)}
.navitem.open{color:#fff}
.navitem.active{background:var(--nav-hi);color:#fff;box-shadow:none;font-weight:600}
.navsub{padding-left:40px;min-height:36px;font-size:14px}
.navdiv{height:1px;background:var(--nav-div);margin:10px 4px}
main.content{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.modhead{padding:28px 40px 16px;display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);margin:0 40px 20px;padding-left:0;padding-right:0}
.modhead h1{font-size:26px;font-weight:500;letter-spacing:-.005em}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:0 40px 20px}
.search{position:relative;flex:1 1 300px;max-width:440px}
.search svg{position:absolute;right:12px;top:11px}
.search input{padding-right:38px}
.tablecard{margin:0 40px;overflow-x:auto;background:transparent;border:0;border-radius:0}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:12px 16px 12px 0;font-size:12px;font-weight:600;letter-spacing:.01em;text-transform:none;color:var(--blue);white-space:nowrap;background:transparent;border-bottom:1px solid var(--line)}
td{padding:14px 16px 14px 0;border-top:1px solid var(--line);vertical-align:middle;font-weight:500}
tr.hl{background:#F3F8FC}
tr.hl td:first-child{box-shadow:inset 3px 0 0 var(--blue)}
.linkbtn{border:0;background:transparent;padding:0;font-weight:500;color:var(--blue);cursor:pointer;text-align:left;font-size:14px}
.listfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px 40px 24px;color:var(--ink);font-weight:600}
.pager button{width:30px;height:30px;border:0;border-radius:3px;background:#fff;color:var(--blue);display:inline-flex;align-items:center;justify-content:center;margin-left:6px;font-weight:600}
.pager .cur{background:var(--blue);color:#fff}
@media (max-width:900px){nav.side{flex:0 0 auto;width:100%;flex-direction:row;flex-wrap:wrap;padding:10px 12px}.body{flex-direction:column}.firmcard{width:auto;margin:0 8px 0 0}.navitem{width:auto}.navsub{padding-left:10px}.navdiv{display:none}.modhead{margin:0 20px 16px}.toolbar,.listfoot{padding-left:20px;padding-right:20px}.tablecard{margin:0 20px}}
/* overlays */
.overlay{position:fixed;inset:0;background:rgba(43,45,49,.55);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(1120px,100%);background:#fff;display:flex;flex-direction:column;z-index:21;box-shadow:-16px 0 48px rgba(0,0,0,.25)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 32px;border-bottom:1px solid var(--line);padding-top:calc(18px + env(safe-area-inset-top,0px))}
.drawer-head h2{font-size:22px;font-weight:500}
.drawer-body{flex:1 1 auto;overflow:auto;padding:24px 32px 32px;display:flex;flex-direction:column;gap:24px}
.drawer-body.cols{padding:0;display:flex;flex-direction:row;flex-wrap:wrap;align-items:flex-start;gap:0}
.drawer-main{flex:999 1 560px;min-width:0;padding:24px 32px 32px;display:flex;flex-direction:column;gap:24px}
.drawer-rail{flex:1 1 320px;max-width:400px;min-width:0;border-left:1px solid var(--line);background:#F7F8FA;padding:24px;display:flex;flex-direction:column;gap:16px;align-self:stretch}
@media (max-width:900px){.drawer-rail{max-width:none;border-left:0;border-top:1px solid var(--line)}}
.drawer-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 32px;border-top:1px solid var(--line);background:var(--surface);padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.section{display:flex;flex-direction:column;gap:16px}
.section + .section{border-top:1px solid var(--line);padding-top:24px}
.section h3{font-size:20px;font-weight:500}
.hr{height:1px;background:var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:14px}
.capcard{background:var(--surface);border:1px solid var(--surface);border-radius:4px;padding:24px;display:flex;flex-direction:column;gap:14px}
.capcard.on{border-color:var(--blue)}
.note{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:4px;font-size:13px}
.note-info{background:var(--blue-tint);border:1px solid var(--blue-line);color:var(--navy2)}
.note-ok{background:var(--green-tint);border:1px solid #9ED5B0;color:var(--green-text)}
.note-warn{background:var(--yellow-tint);border:1px solid var(--yellow-line);color:var(--yellow-text)}
.note-bad{background:var(--orange-tint);border:1px solid #F0C4BF;color:var(--orange)}
.kv{display:flex;flex-direction:column;gap:4px}.kv .k{font-size:12px;color:var(--muted)}.kv .v{font-size:15px;font-weight:500}
.meta{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px 12px;font-size:13px}
.dialog-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;background:rgba(43,45,49,.45);padding:20px}
.dialog{width:min(600px,100%);max-height:calc(100% - 40px);overflow:auto;background:#fff;border-radius:8px;box-shadow:0 24px 64px rgba(0,0,0,.35);padding:24px;display:flex;flex-direction:column;gap:16px}
.dialog h2{font-size:20px;font-weight:500}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:16px;z-index:40;display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border:1px solid #9ED5B0;border-left:4px solid var(--green);border-radius:6px;box-shadow:0 12px 28px rgba(0,0,0,.14);font-size:13px;max-width:440px;color:var(--ink)}
.toast.warn{border-color:var(--yellow-line);border-left-color:#E8A317}
.toast.bad{border-color:#F0C4BF;border-left-color:var(--orange)}
.menu{position:absolute;right:0;top:40px;z-index:5;min-width:240px;border:1px solid var(--line);border-radius:6px;background:#fff;box-shadow:0 12px 28px rgba(0,0,0,.14);padding:6px;display:flex;flex-direction:column;font-size:13px}
.menu button{height:34px;padding:0 10px;border:0;border-radius:4px;background:transparent;color:var(--ink);text-align:left;cursor:pointer;white-space:nowrap;font-weight:500}
.menu button:hover{background:var(--surface)}
.menu button[disabled]{color:var(--faint);cursor:not-allowed}
.menu .sep{height:1px;background:var(--line);margin:4px 0}
.listbox{position:absolute;top:72px;left:0;right:0;margin:0;padding:6px;list-style:none;background:#fff;border:1px solid var(--line2);border-radius:6px;box-shadow:0 12px 28px rgba(0,0,0,.14);z-index:3}
.listbox li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:4px;cursor:pointer}
.listbox li:hover,.listbox li[aria-selected="true"]{background:var(--blue-tint)}
.avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;font-weight:700}
.step{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.stepdot{width:20px;height:20px;flex:0 0 20px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;border:0;cursor:pointer;background:#fff;border:2px solid #C7C9CB}
.stepdot.done{background:var(--green-tint);color:var(--green);border-color:var(--green-tint)}
.stepdot.now{background:var(--yellow-tint);border-color:#E8A317}
.act{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.actdot{width:10px;height:10px;flex:0 0 10px;border-radius:999px;margin-top:5px;border:2px solid #C7C9CB;background:#fff}
.actdot.done{background:var(--green);border-color:var(--green)}.actdot.now{background:#E8A317;border-color:#E8A317}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.between{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
/* lobby */
.lobby{min-height:100%;display:flex;flex-direction:column;background:var(--navy);color:#fff}
.lobby-head{display:flex;align-items:center;justify-content:space-between;padding:28px 36px 0;flex-wrap:wrap;gap:12px}
.lobby-body{flex:1;display:flex;flex-direction:column;gap:28px;padding:40px 36px;max-width:1180px;width:100%;margin:0 auto}
.personas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:900px){.personas{grid-template-columns:1fr}}
.pcard{background:#fff;color:var(--ink);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:14px;text-align:left;border:0;cursor:pointer;box-shadow:0 16px 40px rgba(0,0,0,.28)}
.pcard:hover{box-shadow:0 20px 48px rgba(0,0,0,.36)}
.pcard .who{display:flex;align-items:center;gap:14px}
.actmark{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:4px;white-space:nowrap}
.badge-ink{background:var(--navy2);color:#fff}.badge-amber{background:var(--yellow-tint);color:var(--yellow-text)}
.signin-card{background:#fff;color:var(--ink);border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:18px;max-width:520px;width:100%;box-shadow:0 16px 40px rgba(0,0,0,.28)}
.demo-strip{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;color:#CFE0EE}
.lifecycle{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lifecycle .arrow{color:var(--faint)}
.lobby .btn{background:transparent;color:#CFE0EE;border-color:rgba(255,255,255,.35)}
.lobby .btn:hover{background:rgba(255,255,255,.08)}
/* data panel */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{height:40px;padding:0 14px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font-weight:600;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue)}
.jsonbox{width:100%;min-height:220px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;border:1px solid var(--line2);border-radius:6px;padding:10px;background:#FAFBFC;color:var(--ink);resize:vertical}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>

<script>
'use strict';
const SOURCE_HTML = document.documentElement.outerHTML;
const BUILTIN_SEED_VERSION = 6; /* bump whenever the built-in sample data changes; saved data is migrated, not replaced */
/* ======================================================================
   Seeds — the catalogue, the firm, its users, and the request queue
   ====================================================================== */
const T = (s) => new Date(s).toISOString();
const PERSONAS = {

  fss: {id:'fss', name:'Marcus Bell',   initials:'MB', role:'Firm Security Steward', org:'Harbourview Wealth', orgSub:'External', badge:'Harbourview Wealth', badgeKind:'amber', email:'marcus.bell@harbourview.ca', act:'Acts 2 & 4', color:'#E00223', job:'Requests access for firm users, then collects their one-time credentials.', home:'users'},
  ssa: {id:'ssa', name:'Ravi Desai',    initials:'RD', role:'ID Admin · SSA team', org:'NBIN Internal', orgSub:'Internal', badge:'Internal', badgeKind:'ink', email:'ravi.desai@nbc.ca', act:'Act 3', color:'#048037', job:'Works the queue: starts, fulfils per system, completes or rejects.', home:'queue'}

    case 'user-unlock': { const u = userById(d.id); u.status = 'Active'; u.pwd = 'set'; u.at = nowIso(); clearHl(); u.hl = true; state.ui.menu = null; toast(`${u.first} ${u.last} reset their password — now Active.`); break; }
    case 'cancel-confirm': { const r = reqById(d.req); if(!(state.ui.dialog.reason || '').trim()){ toast('Give a reason for cancelling.', 'bad'); break; } r.status = 'Cancelled'; r.cancel = {reason:state.ui.dialog.reason.trim()}; logAct(r, 'Cancelled'); audit(`Cancelled ${r.id}`); state.ui.dialog = null; toast(`${r.id} cancelled.`); break; }
    case 'duplicate-request': { const r = reqById(d.id); closeDrawer(); state.ui.form = newRequestForm(r.type, null, r); openDrawer('newRequest'); toast(`New request prefilled from ${r.id}. Fix what was rejected, then submit.`); break; }
    case 'copy-confirm': { const r = reqById(d.req); const s = r.systems[d.sys]; copyText(`${s.name} · user ID ${s.creds.id} · temporary password ${s.creds.pwd}`, `${s.name} credentials copied — the password is now deleted from Compass X.`); s.creds.state = 'collected'; s.creds.collectedBy = me().name; s.creds.collectedAt = nowIso(); s.creds.pwd = null; logAct(r, `Collected ${s.name} credentials`); audit(`Collected ${s.name} credentials for ${r.id}`); state.ui.dialog = null; break; }
    /* SSA */
    case 'open-process': openDrawer('process', {id:d.id}); break;
    case 'start-confirm': { const r = reqById(d.req); r.status = 'Under review'; r.startedBy = me().name; r.startedAt = nowIso(); r.systems = buildChecklist(r); logAct(r, 'Started'); audit(`Started ${r.id}`); clearHl(); r.hl = true; state.ui.dialog = null; toast(`${r.id} started — it is in your active cases.`); break; }
    case 'reject-confirm': { const r = reqById(d.req); const dl = state.ui.dialog; if(!dl.reason){ toast('Pick a reason for rejection.', 'bad'); break; } r.status = 'Rejected'; r.rejection = {reason:dl.reason, message:(dl.message || '').trim()}; logAct(r, 'Rejected'); audit(`Rejected ${r.id} — ${dl.reason}`); clearHl(); r.hl = true; state.ui.dialog = null; toast(`${r.id} rejected — ${r.submittedBy} can duplicate it to restart.`); break; }
    case 'step-toggle': { const r = reqById(d.req); const st = r.systems[d.sys].steps[+d.idx]; st.done = !st.done; r.lastBy = me().name; r.lastAt = nowIso(); break; }
    case 'creds-generate': { const r = reqById(d.req); const c = r.systems[d.sys].creds; c.pwd = randomPwd(); if(!c.id) c.id = emailLocal(r.user.email); break; }
    case 'creds-schedule': { const r = reqById(d.req); const c = r.systems[d.sys].creds; if(!c.id.trim() || !c.pwd.trim()){ toast('Enter a user ID and a temporary password first (Generate makes one).', 'bad'); break; } c.state = 'scheduled'; r.lastBy = me().name; r.lastAt = nowIso(); toast(`${r.systems[d.sys].name} credentials scheduled — shared with ${r.firm.name} at completion.`); break; }
    case 'creds-replace': { const r = reqById(d.req); const c = r.systems[d.sys].creds; c.state = 'pending'; c.pwd = ''; break; }
    case 'complete-confirm': { const r = reqById(d.req); if(!checklistComplete(r)){ toast('Finish the checklist first.', 'bad'); break; } applyCompletion(r, state.ui.dialog); audit(`Completed ${r.id} (${r.outcome})`); state.ui.dialog = null; closeDrawer(); toast(`${r.id} completed — ${r.type === 'Create' ? r.user.first + ' is now Invited at ' + r.firm.name + ' and the credentials are ready for the steward.' : (r.type === 'Update' ? 'the new access is live.' : r.user.first + ' is now Inactive.')}`); break; }
    default: return;
  }
  if(state.ui.sessionId && !['noop','toggle-menu','dismiss-toast','close-dialog','close-drawer','nav','data-tab','data-table','data-reload'].includes(action)){ const ss = (state.sessions || []).find(x => x.id === state.ui.sessionId); if(ss) ss.actions = (ss.actions || 0) + 1; }
  commit();
}
function defaultNotes(r){ const parts = []; Object.values(r.systems || {}).forEach(s => parts.push(`${s.name}: ${s.steps.map(x => x.text).join('; ')}${s.creds ? ' — temporary credentials scheduled' : ''}.`)); return parts.join(' '); }
function copyText(text, okMsg){ try{ if(navigator.clipboard) navigator.clipboard.writeText(text).then(() => {}, () => {}); }catch(e){} toast(okMsg || 'Copied.'); }
/* ======================================================================
   Render + wiring
   ====================================================================== */
function drawerView(){ const dr = state.ui.drawer; if(!dr) return ''; switch(dr.kind){ case 'newIntegration': return newIntegrationDrawer(); case 'system': return systemDrawer(); case 'platform': return platformDrawer(); case 'feature': return featureDrawer(); case 'newRequest': return newRequestDrawer(); case 'viewRequest': return viewRequestDrawer(); case 'userProfile': return userProfileDrawer(); case 'process': return processDrawer(); default: return ''; } }
function pageView(){ switch(state.page){ case 'systems': return systemsPage(); case 'features': return featuresPage(); case 'users': return usersPage(); case 'requests': return requestsPage(); case 'firmsettings': return firmSettingsPage(); case 'queue': return queuePage(); default: return ''; } }
function toastView(){ const t = state.toast; if(!t) return ''; return `<div class="toast ${t.kind === 'ok' ? '' : t.kind}" role="status">${ico(t.kind === 'bad' ? 'warn' : (t.kind === 'warn' ? 'info' : 'checkcircle'), 18, t.kind === 'bad' ? '#CC3600' : (t.kind === 'warn' ? '#7A4A00' : '#048037'), 'flex:0 0 18px')}<span>${esc(t.text)}</span>${iconBtn('x','Dismiss','dismiss-toast',{},'style="border:0;width:28px;height:28px"')}</div>`; }
function render(){
  const app = document.getElementById('app');
  const act = document.activeElement; const focus = act && act.id ? {id:act.id, s:act.selectionStart, e:act.selectionEnd} : null;
  const keep = {}; document.querySelectorAll('[data-keep]').forEach(e => keep[e.dataset.keep] = e.scrollTop); const wy = window.scrollY;
  let html;
  if(!state.persona || state.page === 'lobby') html = lobby();
  else html = `<div class="app">${topbar()}<div class="body">${nav()}<main class="content">${pageView()}</main></div></div>`;
  app.innerHTML = html + drawerView() + dialogView() + toastView();
  document.body.style.overflow = (state.ui.drawer || state.ui.dialog) ? 'hidden' : '';
  document.querySelectorAll('[data-keep]').forEach(e => { if(keep[e.dataset.keep] != null) e.scrollTop = keep[e.dataset.keep]; });
  try{ window.scrollTo(0, wy); }catch(e){}
  if(focus){ const el = document.getElementById(focus.id); if(el){ el.focus({preventScroll:true}); try{ if(focus.s != null && el.setSelectionRange) el.setSelectionRange(focus.s, focus.e); }catch(e){} } }
}
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]'); 
  if(state.ui.menu && !e.target.closest('.menu') && !(el && el.dataset.action === 'toggle-menu')){ state.ui.menu = null; if(!el){ render(); return; } }
  if(!el) return;
  if(el.tagName === 'SELECT' || el.tagName === 'INPUT') return; // handled on change
  if(el.dataset.action === 'close-dialog' && el.classList.contains('dialog-wrap') && e.target.closest('.dialog')) return;
  if(el.tagName === 'A') e.preventDefault();
  onAction(el.dataset.action, el, e);
});
document.addEventListener('change', (e) => {
  const el = e.target; if(!(el instanceof Element)) return;
  if(el.dataset.action){ onAction(el.dataset.action, el, e); return; }
  if(el.dataset.bind){ const v = el.type === 'checkbox' ? el.checked : el.value; setPath(state, el.dataset.bind, v); const mr = el.dataset.bind.match(/^catalogue\.(features|functions)\.(\d+)\.resourceId$/); if(mr){ const it = cat()[mr[1]][+mr[2]]; const rr = resById(v); if(it){ it.resource = rr ? rr.key : ''; } } if(el.dataset.bind === 'ui.form.cap' || el.dataset.bind.startsWith('catalogue.') || el.dataset.bind === 'ui.form.type' || el.dataset.bind === 'ui.form.firmLevel' || el.dataset.bind === 'ui.mine' || el.tagName === 'SELECT' || el.type === 'checkbox'){ commit(); } else { save(); } }
});
document.addEventListener('input', (e) => {
  const el = e.target; if(!(el instanceof Element) || !el.dataset.bind) return;
  if(el.type === 'checkbox') return;
  setPath(state, el.dataset.bind, el.value);
  if(el.dataset.bind === 'ui.form.q' && state.ui.form){ state.ui.form.pick = null; if(state.ui.form.type !== 'Create'){ state.ui.form.userId = null; } }
  if(el.dataset.live) render();
});
document.addEventListener('keydown', (e) => { if(e.key === 'Enter' && e.target && e.target.id === 'nr-q'){ const li = document.querySelector('#ta-list li[aria-selected="true"]'); if(li){ e.preventDefault(); onAction('nr-pick', li, e); } return; } if(e.key === 'Escape'){ if(state.ui.dialog){ state.ui.dialog = null; commit(); } else if(state.ui.drawer){ closeDrawer(); commit(); } else if(state.ui.menu){ state.ui.menu = null; commit(); } } });
hydrateSeeds();
if(state.seedNote){ toast(state.seedNote); state.seedNote = null; save(); }
render();
</script>
