<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firm360 hierarchy, 22 Sep 2026</title>
<style>
:root{--paper:#F4F6F8;--panel:#FFFFFF;--ink:#1E2A33;--muted:#55636F;--line:#D3DAE1;--soft:#E9EEF2;
--ib:#0B7A8C;--pm:#C98A06;--ifm:#6B5CA5;--ot:#8794A1;--int:#1E2A33;
--critical:#B42318;--high:#D9480F;--medium:#B7791F;--check:#4A6C8A;--low:#8794A1;--info:#0B7A8C;--match:#F2B705;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#141B21;--panel:#1B242B;--ink:#E6ECF1;--muted:#A3B0BC;--line:#2E3B45;--soft:#22303A;
--ib:#3FB3C6;--pm:#E9AE2F;--ifm:#9C8FD9;--ot:#93A0AD;--int:#E6ECF1;--critical:#F07065;--high:#F28B54;--medium:#E3B341;--check:#8FB0CC;--low:#93A0AD;--info:#3FB3C6;--match:#F2C94C;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.45 "Segoe UI Variable","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;display:flex;flex-direction:column}
header{display:flex;align-items:flex-end;gap:24px;padding:16px 20px 10px;flex-wrap:wrap}
h1{font-size:22px;line-height:1.15;margin:0;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--muted);margin-top:2px}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;color:var(--ink);padding:7px 14px;font:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--ib);outline-offset:2px}
.menu{position:relative}
.menu .pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:250px;z-index:20;box-shadow:0 8px 24px rgba(20,30,40,.18)}
.menu .pop button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:8px 10px;border-radius:6px;font:inherit;cursor:pointer}
.menu .pop button:hover{background:var(--soft)}
.menu .pop small{display:block;color:var(--muted)}
.bar{display:flex;gap:10px;align-items:center;padding:0 20px 12px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0 8px;min-width:340px;flex:0 1 420px}
.search input{border:0;background:transparent;color:var(--ink);font:inherit;padding:8px 2px;flex:1;min-width:0;outline:none}
.search .count{color:var(--muted);white-space:nowrap}
.search button{border:0;background:transparent;color:var(--ink);cursor:pointer;padding:4px 6px;border-radius:4px}
.chk{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);cursor:pointer;user-select:none}
.chk input{accent-color:var(--ib);margin:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);cursor:pointer;user-select:none;color:var(--ink);font:inherit}
.chip[aria-pressed=false]{opacity:.45}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:0;min-height:0;border-top:1px solid var(--line)}
#stage{position:relative;min-height:0;overflow:hidden}
#svg{width:100%;height:100%;display:block;cursor:grab}
#svg:active{cursor:grabbing}
.legend{position:absolute;left:14px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:auto auto;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.toast{position:absolute;right:14px;bottom:12px;background:var(--ink);color:var(--paper);padding:8px 12px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:420px}
.toast.on{opacity:1}
aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:18px 18px 28px}
aside h2{font-size:18px;margin:0 0 2px;line-height:1.25}
aside h3{font-size:13px;margin:18px 0 6px;color:var(--muted);font-weight:600}
aside p{margin:6px 0}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;margin-top:10px}
.kv div:nth-child(odd){color:var(--muted)}
.codes{display:flex;flex-wrap:wrap;gap:4px}
.codes span{border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12.5px}
.issue{border-left:3px solid var(--low);padding:4px 0 4px 10px;margin:6px 0}
.issue b{display:block;font-size:12px;text-transform:none}
.list{list-style:none;padding:0;margin:0}
.list li{padding:5px 0;border-bottom:1px solid var(--soft)}
.list a,.link{color:var(--ib);cursor:pointer;text-decoration:none}
.list a:hover,.link:hover{text-decoration:underline}
.muted{color:var(--muted)}
.stat{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:10px}
.stat b{font-size:20px;line-height:1.1}
.node text{font-size:12.5px;paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round}
@media (max-width:900px){main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 40%}aside{border-left:0;border-top:1px solid var(--line)}.search{min-width:0;flex:1 1 100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Firm360 hierarchy</h1>
    <div class="sub" id="subline"></div>
  </div>
  <div class="spacer"></div>
  <div class="seg" role="group" aria-label="View">
    <button id="vTree" aria-pressed="true">Tree</button>
    <button id="vSun" aria-pressed="false">Overview</button>
  </div>
  <button class="btn" id="expandAll">Expand all</button>
  <button class="btn" id="collapseAll">Collapse all</button>
  <div class="menu">
    <button class="btn" id="dlBtn" aria-haspopup="true" aria-expanded="false">Download</button>
    <div class="pop" id="dlPop" hidden>
      <button id="dlSvg">Picture (SVG)<small>Sharp at any size; expand all first for every node</small></button>
      <button id="dlPng">Picture (PNG)<small>For slides; very large trees are scaled down</small></button>
      <button id="dlCsv">Firm list (CSV)<small>Every firm in the current filter, with issues</small></button>
    </div>
  </div>
</header>
<div class="bar">
  <div class="search">
    <input id="q" type="search" placeholder="Find a firm, company or 4-character RR code" aria-label="Find a firm, company or RR code">
    <span class="count" id="qcount"></span>
    <button id="qprev" aria-label="Previous match">‹</button><button id="qnext" aria-label="Next match">›</button>
  </div>
  <label class="chk"><input type="checkbox" id="fActive"> Active firms only</label>
  <label class="chk"><input type="checkbox" id="fIssues"> Firms with issues only</label>
  <span id="typeChips"></span>
</div>
<main>
  <div id="stage">
    <svg id="svg" role="img" aria-label="Firm hierarchy"></svg>
    <div class="legend" id="legend"></div>
    <div class="toast" id="toast" role="status"></div>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</main>

    <h3>Firms</h3><ul class="list">${kids.map(k => `<li>${worst(k) ? chipsev(worst(k)) + ' ' : ''}<a data-go="${key(k)}">${esc(k.id)}</a> ${esc(k.n)} <span class="muted">${k.t}${k.s === 'A' ? '' : ', inactive'}</span></li>`).join('')}</ul>`; return; }
  const comp = PARENT.get(key(n));
  P.innerHTML = `<h2>${esc(n.id)}</h2><p>${esc(n.n)}</p><p class="muted">${esc(n.legal)}</p>
  <div class="kv"><div>Type</div><div>${esc(n.t)}</div><div>Status</div><div>${n.s === 'A' ? 'Active' : (n.s === 'I' ? 'Inactive' : 'Unknown (0)')}</div>
  <div>Company</div><div>${comp && comp.k === 'c' ? `<a class="link" data-go="${key(comp)}">${esc(n.c)}</a> (${esc(n.p)})` : '<span class="muted">none</span>'}</div>
  <div>Broker / branch</div><div>${esc(n.b)}${n.br ? ' / ' + esc(n.br) : ''}${n.ism ? ' <span class="muted">(ISM ' + esc(n.ism) + ')</span>' : ''}</div>
  <div>Rows in the file</div><div>${n.rows}</div><div>Last updated</div><div>${n.u.slice(0, 4)}-${n.u.slice(4, 6)}-${n.u.slice(6)}</div></div>
  ${(n.fl || []).length ? '<h3>Findings</h3>' + issueHtml(n.fl) : ''}
  <h3>RR codes (${n.rr.length} range${n.rr.length === 1 ? '' : 's'})</h3><div class="codes">${n.rr.map(r => `<span>${esc(r)}</span>`).join('')}${(n.badrr || []).map(r => `<span style="border-color:var(--critical)">${esc(r)}</span>`).join('')}</div>
  <h3>Account ranges</h3><div class="codes">${n.ac.length ? n.ac.map(r => `<span>${esc(r)}</span>`).join('') : '<span class="muted" style="border:0">none</span>'}</div>
  ${n.ovn ? `<h3>Shares codes with ${n.ovn} firm${n.ovn > 1 ? 's' : ''}</h3><ul class="list">${n.ov.map(o => `<li><a data-go="f:${esc(o[0])}">${esc(o[0])}</a> <span class="muted">${o[1]} code${o[1] > 1 ? 's' : ''}, ${esc(o[2])}</span></li>`).join('')}${n.ovn > n.ov.length ? `<li class="muted">and ${n.ovn - n.ov.length} more</li>` : ''}</ul>` : ''}`;
}
$('panel').addEventListener('click', e => { const a = e.target.closest('[data-go]'); if (a) goKey(a.dataset.go); });

/* ---------- search ---------- */
function runSearch(){
  const q = $('q').value.trim(); S.q = q; S.matches = []; S.mi = -1;
  if (q.length >= 2) {
    const ql = q.toLowerCase(); const code = /^[a-z0-9]{4}$/i.test(q) ? cv(q.toUpperCase()) : null;
    const byCode = code == null ? [] : FIRMS.filter(f => f.rr.some(r => { const [a, b] = r.split('–'); const x = cv(a), y = cv(b || a); return x != null && y != null && code >= x && code <= y; }));
    const byText = [...INDEX.values()].filter(n => n.k !== 'r' && (String(n.id).toLowerCase() === ql || String(n.id).toLowerCase().includes(ql) || (n.n || '').toLowerCase().includes(ql) || (n.legal || '').toLowerCase().includes(ql)));
    const seen = new Set(); S.matches = [...byCode, ...byText].filter(n => { const k = key(n); if (seen.has(k)) return false; seen.add(k); return true; });
    if (byCode.length) showCodeOwners(q.toUpperCase(), byCode);
  }
  $('qcount').textContent = q.length >= 2 ? (S.matches.length ? `${S.matches.length} found` : 'None found') : '';
  if (S.matches.length) step(1); else if (S.view === 'tree') renderTree();
}
function showCodeOwners(code, owners){ $('panel').innerHTML = `<h2>Who holds ${esc(code)}</h2><p class="muted">Firms whose RR ranges include this code. More than one active owner means the code is ambiguous.</p><ul class="list">${owners.map(f => `<li>${worst(f) ? chipsev(worst(f)) + ' ' : ''}<a data-go="${key(f)}">${esc(f.id)}</a> ${esc(f.n)} <span class="muted">${f.t}, ${f.s === 'A' ? 'active' : 'inactive'}</span></li>`).join('')}</ul>`; }
function step(dir){ if (!S.matches.length) return; S.mi = (S.mi + dir + S.matches.length) % S.matches.length; const n = S.matches[S.mi]; $('qcount').textContent = `${S.mi + 1} of ${S.matches.length}`;
  S.matches.slice(0, 40).forEach(reveal); reveal(n); if (S.view !== 'tree') setView('tree'); FROOT = filt(DATA.root); S.sel = key(n); renderTree(); centerOn(n); if (!/^[a-z0-9]{4}$/i.test(S.q) || n.k !== 'f' || S.mi > 0) showPanel(n); }
let qt; $('q').addEventListener('input', () => { clearTimeout(qt); qt = setTimeout(runSearch, 220); });
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (S.q !== $('q').value.trim()) runSearch(); else step(e.shiftKey ? -1 : 1); } });
$('qnext').onclick = () => step(1); $('qprev').onclick = () => step(-1);

/* ---------- filters, views, expand ---------- */
function refilter(){ FROOT = filt(DATA.root); S.view === 'tree' ? renderTree() : renderSun(); }
$('fActive').onchange = e => { S.activeOnly = e.target.checked; refilter(); };
$('fIssues').onchange = e => { S.issuesOnly = e.target.checked; if (S.issuesOnly) [...INDEX.values()].filter(n => n.k === 'g' || n.k === 'r').forEach(n => S.open.add(key(n))); refilter(); };
document.querySelectorAll('#typeChips .chip').forEach(b => b.onclick = () => { const t = b.dataset.type; const on = b.getAttribute('aria-pressed') === 'true'; b.setAttribute('aria-pressed', String(!on)); on ? S.types.delete(t) : S.types.add(t); if (t === 'OT') { on ? S.types.delete('—') : S.types.add('—'); } refilter(); });
function setView(v){ S.view = v; $('vTree').setAttribute('aria-pressed', String(v === 'tree')); $('vSun').setAttribute('aria-pressed', String(v === 'sun')); $('expandAll').disabled = $('collapseAll').disabled = v !== 'tree';
  if (v === 'tree') { svg.call(zoom).on('dblclick.zoom', null); gNodes.selectAll('*').remove(); gLinks.selectAll('*').remove(); renderTree(); fitStart(); } else renderSun(); }
$('vTree').onclick = () => setView('tree'); $('vSun').onclick = () => setView('sun');
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 3200); }
$('expandAll').onclick = () => { (function walk(n){ if ((n.children || []).length) { S.open.add(key(n)); n.children.forEach(walk); } })(FROOT); renderTree(); const ext = d3.extent(TREE.descendants(), d => d.x); const k = .62; svg.call(zoom.transform, d3.zoomIdentity.translate(40, 30 - ext[0] * k).scale(k)); toast(`${TREE.descendants().length.toLocaleString()} nodes open. Scroll to travel down, or download a picture to keep them all.`); };
$('collapseAll').onclick = () => { S.open = new Set(['r:root']); renderTree(); fitStart(); };
window.addEventListener('resize', () => { if (S.view === 'sun') renderSun(); });

/* ---------- downloads ---------- */
const dl = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); };
function svgString(){
  const node = svg.node(); const inner = (S.view === 'tree' ? gAll : gNodes).node(); const bb = inner.getBBox(); const pad = 30;
  const clone = node.cloneNode(true); clone.removeAttribute('style'); clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  const w = Math.ceil(bb.width + pad * 2), h = Math.ceil(bb.height + pad * 2);
  clone.setAttribute('width', w); clone.setAttribute('height', h); clone.setAttribute('viewBox', `0 0 ${w} ${h}`);
  const g = clone.querySelector('g'); const t = S.view === 'tree' ? d3.zoomTransform(node) : null;
  g.setAttribute('transform', S.view === 'tree' ? `translate(${pad - (bb.x * 1)},${pad - bb.y})` : `translate(${pad - bb.x},${pad - bb.y})`);
  if (S.view === 'tree') { g.setAttribute('transform', `translate(${pad - bb.x},${pad - bb.y})`); }
  clone.setAttribute('font-family', getComputedStyle(document.body).fontFamily);
  const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect'); bg.setAttribute('width', w); bg.setAttribute('height', h); bg.setAttribute('fill', css('--paper')); clone.insertBefore(bg, clone.firstChild);
  const title = document.createElementNS('http://www.w3.org/2000/svg', 'text'); title.setAttribute('x', pad); title.setAttribute('y', 22); title.setAttribute('font-size', 14); title.setAttribute('font-weight', 650); title.setAttribute('fill', css('--ink')); title.textContent = 'Firm360 hierarchy, file of 22 September 2026' + (S.activeOnly ? ', active firms only' : '') + (S.issuesOnly ? ', firms with issues' : ''); clone.appendChild(title);
  return { text: '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone), w, h };
}
function fileStem(){ return `Firm360_hierarchy_${S.view === 'tree' ? 'tree' : 'overview'}_2026-09-22`; }
$('dlSvg').onclick = () => { closeMenu(); const s = svgString(); dl(new Blob([s.text], { type: 'image/svg+xml' }), fileStem() + '.svg'); toast(`Picture saved: ${s.w.toLocaleString()} × ${s.h.toLocaleString()} px.`); };
$('dlPng').onclick = () => { closeMenu(); const s = svgString(); const scale = Math.min(2, 16000 / Math.max(s.w, s.h)); const img = new Image(); const url = URL.createObjectURL(new Blob([s.text], { type: 'image/svg+xml' }));
  img.onload = () => { const c = document.createElement('canvas'); c.width = Math.round(s.w * scale); c.height = Math.round(s.h * scale); const x = c.getContext('2d'); x.scale(scale, scale); x.drawImage(img, 0, 0); URL.revokeObjectURL(url); c.toBlob(b => { dl(b, fileStem() + '.png'); toast(scale < 1 ? 'Large tree scaled down to fit a PNG; use SVG for full detail.' : 'PNG saved.'); }); }; img.src = url; };
function csvString(){ const rows = [['Group of companies','Company ID','Company','Firm ID','Display name','Legal name','Type','Status','Broker','Branch','RR ranges','Account ranges','Findings']];
  (function walk(n, cat, comp){ if (n.k === 'g') cat = n; if (n.k === 'c') comp = n; if (n.k === 'f') rows.push([cat ? cat.n : '', comp ? comp.id : '', comp ? comp.n : '', n.id, n.n, n.legal, n.t, n.s === 'A' ? 'Active' : (n.s === 'I' ? 'Inactive' : 'Unknown'), n.b, n.br, n.rr.join('; '), n.ac.join('; '), (n.fl || []).map(f => SEV[f[0]][1] + ': ' + f[1]).join(' | ')]); (n.children || []).forEach(c => walk(c, cat, comp)); })(FROOT, null, null);
  return rows.map(r => r.map(v => { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',')).join('\r\n'); }
$('dlCsv').onclick = () => { closeMenu(); dl(new Blob(['\ufeff' + csvString()], { type: 'text/csv' }), 'Firm360_firms_2026-09-22.csv'); toast('Firm list saved.'); };
function closeMenu(){ $('dlPop').hidden = true; $('dlBtn').setAttribute('aria-expanded', 'false'); }
$('dlBtn').onclick = e => { e.stopPropagation(); const p = $('dlPop'); p.hidden = !p.hidden; $('dlBtn').setAttribute('aria-expanded', String(!p.hidden)); };
document.addEventListener('click', e => { if (!e.target.closest('.menu')) closeMenu(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => S.view === 'tree' ? renderTree() : renderSun());

/* ---------- start ---------- */
renderTree(); fitStart(); showPanel(null);
</script>
