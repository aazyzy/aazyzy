<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compass X · Multi-firm prototype · SAA and Product Activation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  color-scheme:light;
  --navy:#02324C; --red:#83181E; --red-dark:#6E1419; --blue:#1572C5; --blue-dark:#0F5A9C; --blue-tint:#E1F1FF; --navy-tint:#E6EDF3;
  --green:#048037; --green-tint:#C3E7CC; --green-text:#0A4D22; --amber:#9A5200; --amber-tint:#FFF3D6; --amber-line:#E8A33A; --f360:#5B3FA3; --f360-tint:#EEE9F8;
  --ink:#2B2D31; --muted:#5F6B7A; --page:#F3F4F6; --surface:#FFFFFF; --chip:#E5E7EB; --line:#DFDFDF; --line2:#C7C9CB;
  --nav-text:#E6EEF5; --shadow:0 2px 6px rgba(2,50,76,.12);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;font-family:Quicksand,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;color:var(--ink);background:var(--page);line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-rows:56px 1fr;grid-template-columns:240px 1fr;height:100%}
.topbar{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--surface);box-shadow:var(--shadow);position:relative;z-index:50}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--navy);letter-spacing:.08em;font-size:15px;white-space:nowrap}
.roundel{width:28px;height:28px;border-radius:50%;background:var(--red);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700}
.grow{flex:1}
.persona{display:inline-flex;border:1px solid var(--navy);border-radius:999px;overflow:hidden}
.persona button{border:0;background:var(--surface);padding:7px 13px;font-weight:600;color:var(--navy);cursor:pointer;white-space:nowrap}
.persona button.on{background:var(--navy);color:#fff}

.circ{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:var(--surface);display:grid;place-items:center;color:var(--ink);cursor:pointer;font-weight:700}
.userchip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 6px;border:1px solid var(--line2);border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap;max-width:280px;overflow:hidden}
.userchip .av{width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:10.5px;flex:none}
.ver{white-space:nowrap}
@media (max-width:1500px){.ver{display:none}}
@media (max-width:1240px){.userchip{display:none}}
.userchip{max-width:230px}
.nav{background:var(--navy);color:var(--nav-text);padding:14px 12px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.firmhome{display:flex;align-items:center;gap:10px;font-weight:600;padding:4px 6px;margin-bottom:6px}
.firmhome .arr{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center}
.firmcard{background:#fff;color:#2B2D31;border-radius:8px;padding:10px 12px;margin:4px 0 10px;cursor:pointer;position:relative}
.firmcard.static{cursor:default}
.firmcard .lbl{font-size:11px;color:#5F6B7A;display:flex;align-items:center;gap:4px}
.firmcard .name{font-weight:700;color:#02324C;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.firmcard .name span:last-child{font-size:12px;color:#1572C5;white-space:nowrap}
.firmcard .who{font-size:11.5px;color:#5F6B7A}
.firmmenu{position:absolute;left:0;top:calc(100% + 4px);width:340px;background:#fff;color:#2B2D31;border-radius:8px;box-shadow:0 8px 24px rgba(2,50,76,.3);padding:6px;display:none;z-index:30;max-height:66vh;overflow:auto}
.firmmenu.open{display:block}
.firmmenu button{display:flex;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:6px;cursor:pointer;align-items:center;gap:8px;color:#2B2D31}
.firmmenu button:hover{background:#F3F4F6}
.firmmenu .parent{font-weight:700;color:#02324C}
.firmmenu .child{padding-left:26px}
.firmmenu .t{margin-left:auto;font-size:11px;color:#5F6B7A;font-weight:500;white-space:nowrap}
.firmmenu .mh{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#5F6B7A;padding:8px 10px 2px;font-weight:700}
.navitem{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;border:0;background:transparent;color:var(--nav-text);text-align:left;cursor:pointer;font-weight:500;width:100%}
.navitem:hover{background:rgba(255,255,255,.12)}
.navitem.active{background:var(--red);color:#fff;font-weight:600}
.navitem .nb{margin-left:auto;background:rgba(255,255,255,.2);border-radius:999px;font-size:11px;padding:1px 8px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12px;color:#C9D7E2;padding:10px 8px 4px;margin-top:auto;border-top:1px solid rgba(255,255,255,.15)}
.legend .sw{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:7px;vertical-align:-1px}
.sw-agg{background:#AFA9EC}.sw-del{background:#EF9F27}.sw-360{background:#C3B1F0;border:1px solid #fff}
.navnote{font-size:11px;color:#9FB3C2;padding:6px 8px 0}
.main{overflow:auto;padding:22px 26px 120px}
.pagehead{display:flex;align-items:flex-start;gap:16px;margin-bottom:12px}
.pagehead h1{font-size:22px;font-weight:700;color:var(--navy)}
.pagehead p{color:var(--muted);margin-top:2px}
.pagehead .actions{margin-left:auto;display:flex;gap:8px}

/* buttons, pills, tags */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 18px;border-radius:999px;border:1px solid var(--blue);background:var(--surface);color:var(--blue);font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--blue-tint)}
.btn-red{border:0;background:var(--red);color:#fff;padding:0 22px}.btn-red:hover{background:var(--red-dark)}
.btn-primary{border:0;background:var(--blue);color:#fff;padding:0 22px}.btn-primary:hover{background:var(--blue-dark)}
.btn.sm{height:32px;font-size:13px;padding:0 14px}
.btn.xs{height:26px;font-size:12px;padding:0 10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:86px;height:22px;padding:0 10px;border-radius:3px;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.pill-green{background:var(--green);color:#fff}.pill-lgreen{background:var(--green-tint);color:var(--green-text)}.pill-grey{background:var(--chip);color:var(--muted)}.pill-amber{background:#E8730C;color:#fff}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:2px 10px;border-radius:999px;background:var(--chip);font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap}
.tag.agg{background:var(--navy);color:#fff}
.tag.del{background:var(--amber-tint);color:var(--amber);border:1px solid var(--amber-line)}
.tag.home{background:var(--blue-tint);color:var(--blue-dark)}
.tag.f360{background:var(--f360-tint);color:var(--f360);border:1px solid var(--f360)}
.tag.outline{background:transparent;border:1px solid var(--line2);color:var(--muted)}
.tag.click{cursor:pointer}
.tag.wrap{white-space:normal}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.mini{border:1px solid var(--line2);background:var(--surface);border-radius:999px;font-size:11px;padding:0 7px;cursor:pointer;color:var(--blue-dark);height:20px;line-height:18px}

/* captions, banners, help */
.caption{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:10px 14px;margin-bottom:14px}
.caption.agg{border-left-color:var(--navy)}
.caption.del{border-left-color:var(--amber-line)}
.caption.f360{border-left-color:var(--f360)}
.caption.meaning{border-left-color:var(--green);margin:6px 0 0}
.caption .ic{width:26px;height:26px;border-radius:50%;background:var(--blue-tint);color:var(--blue-dark);display:grid;place-items:center;font-weight:700;flex:none}
.caption.meaning .ic{background:var(--green-tint);color:var(--green-text)}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:8px;padding:9px 12px;margin:6px 0 10px;font-size:13.5px;background:var(--page);border-left:4px solid var(--line2)}
.banner.agg{background:var(--navy-tint);border-left-color:var(--navy)}
.banner.del{background:var(--amber-tint);border-left-color:var(--amber-line)}
.banner.f360{background:var(--f360-tint);border-left-color:var(--f360)}
.dsteps{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.st{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);background:var(--surface)}
.st.done{color:var(--amber);border-color:var(--amber-line)}
.st.now{background:#B86E00;color:#fff;border-color:#B86E00}
.help{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor;font-size:11px;font-weight:700;cursor:help;position:relative;vertical-align:middle;margin-left:4px;flex:none;color:var(--blue-dark);background:transparent}
.firmcard .help{color:#1572C5}
.help .tip{display:none;position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);width:270px;background:#02324C;color:#fff;font-size:12.5px;font-weight:500;line-height:1.4;padding:10px 12px;border-radius:8px;z-index:80;text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.25);text-transform:none;letter-spacing:0;white-space:normal}
.help:hover .tip,.help:focus-visible .tip,.help.open .tip{display:block}
.help.right .tip{left:auto;right:-4px;transform:none}
.how{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 16px}
.how.one{grid-template-columns:1fr}
.howcard{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:10px;padding:12px 14px}
.howcard.del{border-top-color:var(--amber-line)}
.howcard .hh{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.flow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.flow span{background:var(--page);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12.5px;font-weight:600}
.flow i{font-style:normal;color:var(--muted)}

/* tables */
table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:10px;overflow:hidden}
th{text-align:left;color:var(--blue);font-weight:700;font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer}tr.row:hover td{background:var(--page)}
.name{font-weight:700;color:var(--blue)}
.sub{color:var(--muted);font-size:12.5px}
.rowbtns{display:flex;gap:6px;white-space:nowrap}
.rowbtns .btn{height:28px;font-size:12px;padding:0 10px}
.toolbar{display:flex;gap:12px;align-items:center;margin:0 0 10px;flex-wrap:wrap}
.toolbar input{height:34px;border:1px solid var(--line2);border-radius:999px;padding:0 14px;width:260px;background:var(--surface)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.fchip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.sect{margin:24px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sect h2{font-size:16px;color:var(--navy)}
.sect .actions{margin-left:auto}
.reviewbar{display:flex;gap:10px;align-items:center;background:var(--amber-tint);border:1px solid var(--amber-line);border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:13.5px}
.empty{padding:14px;color:var(--muted);background:var(--surface);border:1px dashed var(--line2);border-radius:10px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi .k{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi .k b{font-size:20px;display:block}
.kpi .k span{font-size:12px;color:var(--muted)}

/* cards */
.relcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--amber-line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.relcard.agg{border-left-color:var(--navy)}
.relcard.ended{opacity:.7}
.relcard .rh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.relcard .rh b{font-size:14.5px}
.relcard .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.relcard .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.group{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--f360);border-radius:10px;padding:14px;display:flex;flex-direction:column}
.group.out{border-top-color:var(--line2);background:repeating-linear-gradient(135deg,var(--surface),var(--surface) 10px,var(--page) 10px,var(--page) 20px)}
.group h3{font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.group .kind{font-size:12px;color:var(--muted);margin:2px 0 10px}
.group .firm{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:6px 8px;border-radius:6px}
.group .firm:hover{background:var(--page)}
.group .firm .t{font-size:11px;color:var(--muted);white-space:nowrap;text-align:right}
.group .firm .lnk{border:0;background:transparent;color:var(--red);font-weight:600;cursor:pointer;font-size:12px;padding:2px 4px}
.group .acts{display:flex;gap:8px;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.code{font-family:"Cascadia Code",Menlo,Consolas,monospace;font-size:12px;background:var(--chip);padding:1px 6px;border-radius:4px}

/* drawer */
.scrim{position:fixed;inset:56px 0 0 0;background:rgba(2,50,76,.35);display:none;z-index:40}
.scrim.open{display:block}
.drawer{position:fixed;top:56px;right:0;bottom:0;width:min(660px,100%);background:var(--surface);box-shadow:-8px 0 32px rgba(0,0,0,.25);transform:translateX(100%);transition:transform .22s ease;z-index:45;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer header{padding:16px 22px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer header h2{font-size:18px;color:var(--navy);font-weight:700}
.drawer .body{padding:14px 22px;overflow:auto;flex:1}
.drawer footer{padding:12px 22px;border-top:1px solid var(--line);background:var(--page);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.drawer footer .ro{margin-right:auto}
.x{margin-left:auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:var(--surface);cursor:pointer;color:var(--ink);flex:none}
.sec{margin:14px 0}
.sec h3{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:center}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13.5px}.kv .k{color:var(--muted)}
.before{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.before .t{background:var(--page);border-radius:8px;padding:8px;text-align:center}
.before .n{font-size:20px;font-weight:700;color:var(--red)}
.before .l{font-size:11.5px;color:var(--muted)}
.after{display:flex;align-items:center;gap:10px;background:var(--green-tint);color:var(--green-text);border-radius:8px;padding:9px 12px;font-weight:600;margin-top:8px}
.tree{background:var(--page);border-radius:8px;padding:10px}
.tree .node{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px}
.tree .node.p{font-weight:700}.tree .node.c{margin-left:22px}
.tree .node.hit{background:var(--navy-tint)}
.tree .node .rr{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
.tree .dot{width:8px;height:8px;border-radius:50%;background:var(--line2);flex:none}.tree .hit .dot{background:var(--navy)}
.profile{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.profile.parent{border-left:4px solid var(--navy)}.profile.home,.profile.firm{border-left:4px solid var(--line2)}.profile.sa{border-left:4px solid var(--amber-line)}
.profile .ph{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.deleg{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#02324C;color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s;z-index:90;max-width:80vw;text-align:center}
.toast.show{opacity:1}

/* forms */
.seg{display:inline-flex;border:1px solid var(--navy);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 14px;font-weight:600;color:var(--navy);cursor:pointer}

.seg button.on{background:var(--navy);color:#fff}
.field{margin-bottom:12px}
.field > label{display:flex;align-items:center;font-size:12.5px;font-weight:700;margin-bottom:5px}
.input{width:100%;height:38px;border:1px solid var(--line2);border-radius:6px;padding:0 10px;background:var(--surface)}
.radio{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:6px;cursor:pointer}
.radio.on{border-color:var(--blue);background:var(--blue-tint)}
.radio.off{opacity:.6;cursor:not-allowed}
.radio .r{width:16px;height:16px;border-radius:50%;border:2px solid var(--line2);margin-top:2px;flex:none}
.radio.on .r{border-color:var(--blue);background:radial-gradient(var(--blue) 45%,transparent 50%)}
.radio .rt{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.featgrp{background:var(--page);border-radius:8px;padding:8px 12px;margin-bottom:8px}
.featgrp .g{font-weight:700;font-size:12.5px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.featgrp .g .count{margin-left:auto;background:var(--navy);color:#fff;border-radius:999px;font-size:11px;padding:1px 8px}
.feat{display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer;font-size:13.5px}
.feat.off{opacity:.45;cursor:not-allowed}
.feat .cb{width:16px;height:16px;border-radius:3px;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none;background:var(--surface)}
.feat.on .cb{background:var(--navy);border-color:var(--navy);color:#fff;font-size:11px}
.feat .why{margin-left:auto;font-size:11.5px;color:var(--muted);text-align:right}
.ulist{border:1px solid var(--line2);border-radius:6px;max-height:170px;overflow:auto;background:var(--surface)}
.ulist button{display:flex;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;cursor:pointer;gap:8px;align-items:center}
.ulist button:hover{background:var(--page)}
.ulist button.on{background:var(--blue-tint)}
.check{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer}
.check.on{border-color:var(--green);background:var(--green-tint)}
.check .cb{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--line2);display:grid;place-items:center;background:var(--surface);flex:none}
.check.on .cb{background:var(--green);border-color:var(--green);color:#fff;font-size:12px}
.check .d{font-size:12px;color:var(--muted)}
.timeline .node{display:flex;gap:10px;padding:5px 0;font-size:13.5px}
.timeline .dot{width:10px;height:10px;border-radius:50%;background:var(--blue);margin-top:5px;flex:none}
.cbline{display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer}
.rredit{background:var(--page);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:8px}
.rredit .opts{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.rredit .opt{display:flex;gap:6px;align-items:center;cursor:pointer;font-weight:600;font-size:13px}

  const acts = side === 'out' && !ended ? `<button class="btn sm" data-act="confirmdel" data-id="${d.id}">Confirm still valid</button><button class="btn btn-red sm" data-act="enddel" data-id="${d.id}">End delegation</button>${help('Confirming is your attestation of the relationship, not of the people. Ending it removes every access given through it immediately; NBIN records the end in Firm360.')}` : side === 'in' && !ended ? `<span class="sub">Only ${esc(fname(d.from))} can end this. To choose who uses these accounts, raise a request from Users.</span>` : '';
  return `<div class="relcard${ended ? ' ended' : ''}" data-del="${d.id}"><div class="rh"><span class="tag del">${d.type === 'Referral' ? 'Delegation · referral' : 'Delegation · sub-advisory'}</span><span class="tag f360">Firm360</span><b>${esc(fname(d.from))} → ${esc(to)}</b>${pill(d.status)}</div>
    <div class="meta"><span>Accounts: <b>${esc(d.rr)}</b></span><span>${d.type === 'Referral' ? 'View only' : 'Trading only'}</span><span>Agreement ${esc(d.agreement)}</span><span>Since ${esc(d.since)}</span>${ended ? `<span>Ended ${esc(d.ended || '')}</span>` : `<span>Last confirmed ${esc(d.confirmed)}</span>`}</div>
    <div class="meta"><span>${users.length ? 'Used by: ' + users.map(u => esc(u.name)).join(', ') : 'Nobody uses these accounts yet'}</span></div>
    <div class="acts">${acts}</div></div>`;
}
function scrRel(){

/* ===================== NBIN: group changes in Firm360 ===================== */
function openGC(kind, g, c){ GC = {kind, g, c:c || null, sel:null}; renderGC(); }
function gcImpact(){ const {kind, g, c, sel} = GC;

    return `<b>${esc(fname(c))}</b> becomes a standalone firm on the next sync. Its own ${own} people keep their access.<br>${holders.length ? 'Group-wide profiles lose its accounts: ' + holders.map(p => `<b>${esc(p.name)}</b> (${esc(rrLabel(c, p.profiles.find(pr => pr.kind === 'parent').rr[c]))})`).join(', ') + '. Their linked Secured Zone IDs for that firm go to the SAA queue as clean-ups.' : 'No group-wide profile reaches it.'}`; }
  if (!sel) return 'Choose an option to see the effect in Compass.';
  if (kind === 'add') return `<b>${esc(fname(sel))}</b> joins ${esc(fname(g))}. Its ${PEOPLE.filter(p => inList(p, sel)).length} people appear in the group steward’s list. Nobody gains access until a steward asks for it; ${esc(fname(sel))}’s own steward now acts only inside ${esc(fname(sel))}.`;
  const holders = PEOPLE.filter(p => p.profiles.some(pr => pr.kind === 'parent' && pr.firm === g));
  return `${esc(fname(g))}’s ${children(g).length} firms move under <b>${esc(fname(sel))}</b>, still one level. ${esc(fname(g))} is dissolved. Everyone in its firms keeps their access.${holders.length ? ' Group-wide profiles at ' + esc(fname(g)) + ' are flagged for review by ' + esc(fname(sel)) + '’s steward: ' + holders.map(p => '<b>' + esc(p.name) + '</b>').join(', ') + '.' : ''}`; }
function renderGC(){ const {kind, g, c, sel} = GC;
  let opts = '';
  if (kind === 'add') { const cands = Object.keys(FIRMS).filter(k => !FIRMS[k].reporting && !FIRMS[k].dissolved && k !== g && !children(g).includes(k));
    opts = cands.map(k => { const why = FIRMS[k].group ? 'is itself a parent group — one level only' : FIRMS[k].parent ? 'already belongs to ' + fname(FIRMS[k].parent) : null; return `<div class="radio${why ? ' off' : (sel === k ? ' on' : '')}" data-act="gcsel" data-id="${k}"><span class="r"></span><div><b>${esc(fname(k))}</b> <span class="code">${esc(firmId(k))}</span><div class="sub">${why ? esc(why) : esc(FIRMS[k].type) + ' · standalone firm'}</div></div></div>`; }).join('')
      + `<div class="radio off"><span class="r"></span><div><b>${esc(FIRMS.maple.name)}</b><div class="sub">a reporting grouping, not a firm — never part of a group</div></div></div>`; }
  if (kind === 'merge') opts = Object.keys(FIRMS).filter(k => isGroup(k) && k !== g).map(k => `<div class="radio${sel === k ? ' on' : ''}" data-act="gcsel" data-id="${k}"><span class="r"></span><div><b>${esc(fname(k))}</b> <span class="code">${esc(FIRMS[k].pcode)}</span><div class="sub">${children(k).length} firms today</div></div></div>`).join('');
  const title = kind === 'add' ? 'Add a firm to ' + esc(fname(g)) : kind === 'remove' ? 'Remove ' + esc(fname(c)) + ' from ' + esc(fname(g)) : 'Merge ' + esc(fname(g)) + ' into another group';
  const ok = kind === 'remove' || !!sel;
  openDrawer(`${head(title, 'Firm360 · Product Activation · group change')}
  <div class="body"><div class="banner f360"><span class="tag f360">Firm360</span><div>Record this only when it is real — operationally and contractually. Groups are one level deep: a group can never sit inside another group. Compass applies the effect below on the next sync.</div></div>
    ${opts ? `<div class="field"><label>${kind === 'add' ? 'Which firm joins' : 'Into which group'}</label>${opts}</div>` : ''}
    <div class="caption meaning"><div class="ic">=</div><div><b>Effect in Compass</b><div class="sub" style="color:var(--ink)">${gcImpact()}</div></div></div></div>
  <footer><button class="btn" data-act="close">Cancel</button><button class="btn btn-primary" data-act="gcconfirm" id="confirmGroup" ${ok ? '' : 'disabled'}>${kind === 'remove' ? 'Remove firm' : kind === 'add' ? 'Add firm' : 'Merge groups'}</button></footer>`); }
function confirmGC(){ const {kind, g, c, sel} = GC;

const roleKeyOf = pr => { let best = null, bs = -1; Object.keys(ROLEFEAT).forEach(k => { const f = ROLEFEAT[k]; const sc = f.filter(x => pr.features.includes(x)).length - Math.abs(f.length - pr.features.length); if (sc > bs) { bs = sc; best = k; } }); return best; };

  if (pr.kind === 'sa') [...s].forEach(m => { if (!(pr.referral ? REF_ALLOWED : SA_ALLOWED).has(m)) s.delete(m); });
  pr.modules = [...s]; const rk = roleKeyOf(pr); pr.role = PKG_LABEL[rk] || 'Manage All'; if (pr.kind === 'sa') pr.role = pr.referral ? 'View Only' : 'Manage Orders';
  pr.perms = {'View System Health Events': false, 'Manage Mutual Fund Orders': pr.features.includes('ord'), 'Manage Equity Orders': pr.features.includes('ord'), 'Manage Options Orders': pr.features.includes('opt'), 'Manage CRS FATCA Submissions': pr.features.includes('onb') && (rk === 'ops' || rk === 'compliance' || rk === 'steward')}; })); }

/* ===================== scroll-safe handlers ===================== */
Object.assign(ACT, {
  user: id => openUserPanel({pid:id}), modify: id => openUserPanel({pid:id}), deact: id => openUserPanel({pid:id}), newreq: () => openUserPanel({create:true, firm:me}),
  upprof: id => { UP.idx = parseInt(id); renderUserPanel(true); }, uphist: () => { UP.hist = !UP.hist; renderUserPanel(true); },
  upsave: () => { try { upSave(); } catch (e) { if (e.message !== 'ceiling') throw e; } },
  updeact: () => { const p = byId(UP.pid); p.status = 'INACTIVE'; REQ.unshift({id:'R-' + (nextReq++), type:'Deactivate', pid:p.id, ctx:managedBy(p), kindP:mainProfile(p).kind, rr:{}, features:[], dels:[], dscope:{}, status:'COMPLETE', by:managedBy(p), done:{cx:true, sz:false, r2:false, link:true}, log:['Received by email from ' + stewardName(managedBy(p)), 'Compass login and SSO stopped', 'Secured Zone profile disable: assigned to the Security App owner'], applied:true}); closeDrawer(); KEEP = true; render(); toast(`${p.name} deactivated — Compass and SSO stopped; the Secured Zone profile is a separate step.`); },
  upreact: () => { const p = byId(UP.pid); p.status = 'ACTIVE'; closeDrawer(); KEEP = true; render(); toast(`${p.name} reactivated.`); },
  pvgroup: id => { NAVOPEN[id] = !NAVOPEN[id]; KEEP = true; render(); }, pvnav: id => { PVX.screen = id; NAVOPEN = {}; render(); },
  pvext: id => toast(id + ' opens in a separate Secured Zone or partner app with the linked ID.'),
  fstoggle: (id, el) => { const F = FIRMS[me]; F.optout = F.optout || []; const i = F.optout.indexOf(id); if (el.checked) { if (i >= 0) F.optout.splice(i, 1); } else if (i < 0) F.optout.push(id); document.querySelectorAll(`.fsrow input[data-id="${id}"]`).forEach(c => { c.checked = el.checked; c.closest('.fsrow').classList.toggle('offrow', !el.checked); }); document.querySelectorAll('.fsgroup').forEach(g => { const ins = [...g.querySelectorAll('input[data-act=fstoggle]')]; if (ins.length) g.classList.toggle('dim', ins.every(c => !c.checked)); }); toast(`${fname(me)}: ${FEAT[id] || id} ${el.checked ? 'switched on' : 'switched off'}. Group packages and every user package follow.`); },
  filter: id => { filter = id; KEEP = true; render(); },
});
document.addEventListener('change', e => { const t = e.target; if (t.id === 'uprole' && UP) upApplyRole(t.value); if (t.id === 'hideoff') { HIDEOFF = t.checked; KEEP = true; render(); } if (t.id === 'upfla' && UP) { const rr = $('#uprr'); if (rr) rr.disabled = t.checked; } });
document.addEventListener('input', e => { const t = e.target; if (UP && UP.create && (t.id === 'upfn' || t.id === 'upln')) { UP.name = ($('#upfn').value + ' ' + $('#upln').value).trim(); const u = $('#upuid'); if (u && !u.dataset.touched) u.value = usernameOf({name:UP.name}); const h = $('#drawer .up-head h2'); if (h) h.textContent = UP.name || 'New user'; } if (t.id === 'upuid') t.dataset.touched = '1'; });

/* ===================== stories: use the CX panel ===================== */
(function patchStories(){
  const S = id => STORIES.find(s => s.id === id);
  const a = S('agg1').steps; a[4].do = () => { go('saa', 'hfg', 'users'); openUserPanel({pid:aaron.id}); later('#drawer .rrtable'); }; a[4].s = 'Penny’s example. Aaron exists seven times because Compass can only put a person in one firm. One group-wide profile: Parent Level Access and RR codes per child firm, with his Secured Zone and R2 IDs linked.';
  a[5].do = () => { go('saa', 'hfg', 'users'); openUserPanel({pid:lena.id}); later('#drawer .rrtable'); }; a[5].s = 'Lena supervises two of the five firms, and inside KJ Harrison only one range. Each child firm has its own RR codes row — Radhika’s requirement.';
  a[6].do = () => { go('saa', 'hfg', 'users'); openUserPanel({create:true, firm:'hfg'}); later('#drawer .modules'); }; a[6].t = 'Create a parent user from an email request'; a[6].s = 'SAA records the request it received and sets the person up in the parent group with the real module list and Parent Level Access. No steward in Compass.';
  const d = S('del1').steps; d[3].do = () => { go('saa', 'gp', 'users'); openUserPanel({pid:nora.id}); later('#upprofs'); }; d[3].s = 'Full access at home, trading only on the delegated slices. One Compass ID cannot carry two feature sets, so she has two profiles under one login; the panel edits each one.';
  d[4].do = () => { go('saa', 'gp', 'users'); openUserPanel({pid:nora.id, idx:1}); later('#drawer .scopes'); }; d[4].s = 'SAA sets Nora’s delegated profile from the request: the whole slice or specific codes inside it, never more than Fiera, Kensel and Dundee delegated. Modules outside the sub-advisory bundle are greyed out.';
  d[5].do = () => { go('saa', 'gp', 'users'); openUserPanel({pid:theo.id, idx:1}); later('#drawer .scopes'); };
  d[6].s = 'One sign-in. The switcher moves between her home profile and the delegated accounts; the left navigation shows exactly the Compass menus her profile allows.';
  const r = S('del2').steps; r[0].do = () => { go('saa', 'tricert', 'users'); openUserPanel({pid:priya.id}); later('#drawer .modules'); };
  const s = S('saa1').steps; s[3].do = () => { go('saa', 'rot', 'users'); const p = PEOPLE.find(x => mainProfile(x) && mainProfile(x).firm === 'rot' && x.status === 'ACTIVE'); openUserPanel({pid:p.id}); later('#drawer .up-foot'); }; s[3].s = 'Deactivate User stops Compass login and SSO at once; the Secured Zone profile is a separate step with a named owner; R2 and NetRep IDs are untouched.';
})();
Object.assign(SHOW, { aaron: () => { go('saa', 'hfg', 'users'); openUserPanel({pid:aaron.id}); }, lena: () => { go('saa', 'hfg', 'users'); openUserPanel({pid:lena.id}); }, omarform: () => { go('saa', 'hfg', 'users'); openUserPanel({create:true, firm:'hfg'}); }, sanaform: () => { go('saa', 'kjh', 'users'); openUserPanel({create:true, firm:'kjh'}); }, noraform: () => { go('saa', 'gp', 'users'); openUserPanel({pid:nora.id, idx:1}); }, nora: () => { go('saa', 'gp', 'users'); openUserPanel({pid:nora.id}); }, theo: () => { go('saa', 'gp', 'users'); openUserPanel({pid:theo.id, idx:1}); }, tricert: () => { go('saa', 'tricert', 'users'); openUserPanel({pid:priya.id}); }, tricertform: () => { go('saa', 'tricert', 'users'); openUserPanel({create:true, firm:'tricert'}); }, deact: () => { go('saa', 'rot', 'users'); const p = PEOPLE.find(x => mainProfile(x) && mainProfile(x).firm === 'rot' && x.status === 'ACTIVE'); openUserPanel({pid:p.id}); }, sergio: () => { go('saa', 'gcg', 'users'); openUserPanel({pid:sergio.id}); }, devin: () => { go('saa', 'wag', 'users'); openUserPanel({pid:devin.id}); }, joanne: () => { go('saa', 'cmg', 'users'); openUserPanel({pid:joanne.id}); } });


/* ===================== Impersonate: entry points ===================== */
let IMPQ = '';
function impList(){ const q = IMPQ.toLowerCase().trim(); const named = [aaron, lena, omar, devin, nora, theo, priya, sergio, joanne].filter(Boolean).map(p => p.id);
  let list = PEOPLE.filter(p => p.profiles.length && p.status !== 'INACTIVE'); if (q) list = list.filter(p => (p.name + ' ' + p.role + ' ' + usernameOf(p) + ' ' + reach(p).map(r => fname(r.f)).join(' ')).toLowerCase().includes(q));
  list.sort((a, b) => (named.includes(b.id) - named.includes(a.id)) || a.name.localeCompare(b.name)); return list.slice(0, 40); }
function impPanel(){ const el = $('#imp'); const rows = impList().map(p => `<div class="imp-row"><div class="imp-txt"><b>${esc(p.name)}</b><span class="fsd">${esc(usernameOf(p))} · ${esc(p.role)}</span></div><div class="imp-btns">${p.profiles.map((pr, i) => `<button class="cxb grey xs" data-act="impersonate" data-id="${p.id}" data-idx="${i}">${ico('eye', 14, '#333', 2)} ${esc(profileLabel(pr))}</button>`).join('')}</div></div>`).join('');
  el.innerHTML = `<div class="sp-h"><h2>Impersonate a user</h2><span class="fsd">Open Compass as this person: the left navigation and the screens show exactly what their profile allows.</span><button class="x" data-act="impclose" aria-label="Close">✕</button></div>
    <div class="cxsearch imp-s"><label for="impq" class="sr">Search users</label><input id="impq" type="search" placeholder="Search by name, ID, role or firm" value="${esc(IMPQ)}">${ico('search', 18, '#1B6AC2', 2)}</div>
    <div class="imp-list">${rows || '<span class="fsd">No one matches.</span>'}</div>`; el.hidden = false; const q = $('#impq'); if (q && IMPQ) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
Object.assign(ACT, {
  impopen: () => { endGuide(); closeDrawer(); $('#stories').hidden = true; impPanel(); }, impclose: () => { $('#imp').hidden = true; },
  impersonate: (id, el) => { $('#imp').hidden = true; const idx = el && el.dataset.idx ? parseInt(el.dataset.idx) : (UP && UP.pid === id ? UP.idx : 0); enterPreview(id, idx, 'pvaccounts'); toast('Impersonating ' + byId(id).name + '. Use Exit in the navigation to return.'); },
});
document.addEventListener('input', e => { if (e.target.id === 'impq') { IMPQ = e.target.value; impPanel(); } });
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); const panel = $('#imp'); if (panel && !panel.hidden && !e.target.closest('#imp') && !(el && el.dataset.act === 'impopen')) panel.hidden = true; });
/* Users list: an Impersonate button on every row */
userRows = function(list){ if (!list.length) return `<tr><td colspan="9" class="fsd">No one matches. Try a firm name or a person.</td></tr>`;
  return list.map(p => { const mp = mainProfile(p); const multi = p.before && p.before.cx > 1 && !(mp && mp.kind === 'parent');
    return `<tr class="row" data-act="user" data-id="${p.id}" tabindex="0"><td><a href="#" class="idlink">${esc(usernameOf(p))}</a> ${ico('info', 14, '#1B6AC2', 2)}</td><td><div class="name">${esc(p.name)}</div><div class="sub">${esc(p.role.split(' · ')[0])}</div></td><td>${p.needsReview ? cxPill('REVIEW','amber') : statusPill(p.status)}</td><td>${lockpair(p.status === 'INVITED')}</td><td>${esc(emailOf(p))}</td><td>${esc(pkgLabel(p))}</td><td><div class="chips">${p.profiles.map(ptag).join('')}${multi ? `<span class="cxp cxp-amber">${p.before.cx} IDs</span>` : ''}</div></td><td class="sub" title="${esc(reach(p).map(r => fname(r.f)).join(', '))}">${reach(p).length} firm${reach(p).length === 1 ? '' : 's'}</td><td>${p.status === 'INACTIVE' ? '' : `<button class="cxb grey xs" data-act="impersonate" data-id="${p.id}" data-idx="0" title="Open Compass as ${esc(p.name)}">${ico('eye', 14, '#333', 2)} Impersonate</button>`}</td></tr>`; }).join(''); }
const _scrUsers = scrUsers;
scrUsers = function(){ return _scrUsers().replace('<th style="width:6%">Reaches</th></tr></thead>', '<th style="width:6%">Reaches</th><th style="width:9%"></th></tr></thead>').replace('<th style="width:22%">Email</th>', '<th style="width:18%">Email</th>'); }
/* User panel: Impersonate in the header */
const _renderUserPanel = renderUserPanel;
renderUserPanel = function(keep){ _renderUserPanel(keep); if (!UP || UP.create) return; const h = $('#drawer .up-head'); if (h && !h.querySelector('[data-act=impersonate]')) { const b = document.createElement('button'); b.className = 'cxb grey xs'; b.dataset.act = 'impersonate'; b.dataset.id = UP.pid; b.dataset.idx = UP.idx; b.innerHTML = ico('eye', 14, '#333', 2) + ' Impersonate this profile'; h.insertBefore(b, h.querySelector('.x')); } }

setPersona('saa');
</script>
