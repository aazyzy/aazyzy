<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compass X · Multi-firm prototype · v19 · leak check, and a reason for a second ID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  color-scheme:light;
  --navy:#02324C; --red:#83181E; --red-dark:#6E1419; --blue:#1572C5; --blue-dark:#0F5A9C; --blue-tint:#E1F1FF; --navy-tint:#E6EDF3;
  --green:#048037; --green-tint:#C3E7CC; --green-text:#0A4D22; --amber:#9A5200; --amber-tint:#FFF3D6; --amber-line:#E8A33A; --f360:#5B3FA3; --f360-tint:#EEE9F8;
  --ink:#2B2D31; --muted:#5F6B7A; --page:#F3F4F6; --surface:#FFFFFF; --chip:#E5E7EB; --line:#DFDFDF; --line2:#C7C9CB;
  --nav-text:#E6EEF5; --shadow:0 2px 6px rgba(2,50,76,.12);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;font-family:Quicksand,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;color:var(--ink);background:var(--page);line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* shell */
.app{display:grid;grid-template-rows:56px 1fr;grid-template-columns:240px 1fr;height:100%}
.topbar{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--surface);box-shadow:var(--shadow);position:relative;z-index:50}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--navy);letter-spacing:.08em;font-size:15px;white-space:nowrap}
.roundel{width:28px;height:28px;border-radius:50%;background:var(--red);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700}
.grow{flex:1}
.persona{display:inline-flex;border:1px solid var(--navy);border-radius:999px;overflow:hidden}
.persona button{border:0;background:var(--surface);padding:7px 13px;font-weight:600;color:var(--navy);cursor:pointer;white-space:nowrap}
.persona button.on{background:var(--navy);color:#fff}

.circ{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:var(--surface);display:grid;place-items:center;color:var(--ink);cursor:pointer;font-weight:700}
.userchip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 6px;border:1px solid var(--line2);border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap;max-width:280px;overflow:hidden}
.userchip .av{width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:10.5px;flex:none}
.ver{white-space:nowrap}
@media (max-width:1500px){.ver{display:none}}
@media (max-width:1240px){.userchip{display:none}}
.userchip{max-width:230px}
.nav{background:var(--navy);color:var(--nav-text);padding:14px 12px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.firmhome{display:flex;align-items:center;gap:10px;font-weight:600;padding:4px 6px;margin-bottom:6px}
.firmhome .arr{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--navy);display:grid;place-items:center}
.firmcard{background:#fff;color:#2B2D31;border-radius:8px;padding:10px 12px;margin:4px 0 10px;cursor:pointer;position:relative}
.firmcard.static{cursor:default}
.firmcard .lbl{font-size:11px;color:#5F6B7A;display:flex;align-items:center;gap:4px}
.firmcard .name{font-weight:700;color:#02324C;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.firmcard .name span:last-child{font-size:12px;color:#1572C5;white-space:nowrap}
.firmcard .who{font-size:11.5px;color:#5F6B7A}
.firmmenu{position:absolute;left:0;top:calc(100% + 4px);width:340px;background:#fff;color:#2B2D31;border-radius:8px;box-shadow:0 8px 24px rgba(2,50,76,.3);padding:6px;display:none;z-index:30;max-height:66vh;overflow:auto}
.firmmenu.open{display:block}
.firmmenu button{display:flex;width:100%;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:6px;cursor:pointer;align-items:center;gap:8px;color:#2B2D31}
.firmmenu button:hover{background:#F3F4F6}
.firmmenu .parent{font-weight:700;color:#02324C}
.firmmenu .child{padding-left:26px}
.firmmenu .t{margin-left:auto;font-size:11px;color:#5F6B7A;font-weight:500;white-space:nowrap}
.firmmenu .mh{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#5F6B7A;padding:8px 10px 2px;font-weight:700}
.navitem{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;border:0;background:transparent;color:var(--nav-text);text-align:left;cursor:pointer;font-weight:500;width:100%}
.navitem:hover{background:rgba(255,255,255,.12)}
.navitem.active{background:var(--red);color:#fff;font-weight:600}
.navitem .nb{margin-left:auto;background:rgba(255,255,255,.2);border-radius:999px;font-size:11px;padding:1px 8px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12px;color:#C9D7E2;padding:10px 8px 4px;margin-top:auto;border-top:1px solid rgba(255,255,255,.15)}
.legend .sw{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:7px;vertical-align:-1px}
.sw-agg{background:#AFA9EC}.sw-del{background:#EF9F27}.sw-360{background:#C3B1F0;border:1px solid #fff}
.navnote{font-size:11px;color:#9FB3C2;padding:6px 8px 0}
.main{overflow:auto;padding:22px 26px 120px}
.pagehead{display:flex;align-items:flex-start;gap:16px;margin-bottom:12px}
.pagehead h1{font-size:22px;font-weight:700;color:var(--navy)}
.pagehead p{color:var(--muted);margin-top:2px}
.pagehead .actions{margin-left:auto;display:flex;gap:8px}

/* buttons, pills, tags */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 18px;border-radius:999px;border:1px solid var(--blue);background:var(--surface);color:var(--blue);font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--blue-tint)}
.btn-red{border:0;background:var(--red);color:#fff;padding:0 22px}.btn-red:hover{background:var(--red-dark)}
.btn-primary{border:0;background:var(--blue);color:#fff;padding:0 22px}.btn-primary:hover{background:var(--blue-dark)}
.btn.sm{height:32px;font-size:13px;padding:0 14px}
.btn.xs{height:26px;font-size:12px;padding:0 10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:86px;height:22px;padding:0 10px;border-radius:3px;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.pill-green{background:var(--green);color:#fff}.pill-lgreen{background:var(--green-tint);color:var(--green-text)}.pill-grey{background:var(--chip);color:var(--muted)}.pill-amber{background:#E8730C;color:#fff}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:2px 10px;border-radius:999px;background:var(--chip);font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap}
.tag.agg{background:var(--navy);color:#fff}
.tag.del{background:var(--amber-tint);color:var(--amber);border:1px solid var(--amber-line)}
.tag.home{background:var(--blue-tint);color:var(--blue-dark)}
.tag.f360{background:var(--f360-tint);color:var(--f360);border:1px solid var(--f360)}
.tag.outline{background:transparent;border:1px solid var(--line2);color:var(--muted)}
.tag.click{cursor:pointer}
.tag.wrap{white-space:normal}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.mini{border:1px solid var(--line2);background:var(--surface);border-radius:999px;font-size:11px;padding:0 7px;cursor:pointer;color:var(--blue-dark);height:20px;line-height:18px}

/* captions, banners, help */
.caption{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:10px 14px;margin-bottom:14px}
.caption.agg{border-left-color:var(--navy)}
.caption.del{border-left-color:var(--amber-line)}
.caption.f360{border-left-color:var(--f360)}
.caption.meaning{border-left-color:var(--green);margin:6px 0 0}
.caption .ic{width:26px;height:26px;border-radius:50%;background:var(--blue-tint);color:var(--blue-dark);display:grid;place-items:center;font-weight:700;flex:none}
.caption.meaning .ic{background:var(--green-tint);color:var(--green-text)}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:8px;padding:9px 12px;margin:6px 0 10px;font-size:13.5px;background:var(--page);border-left:4px solid var(--line2)}
.banner.agg{background:var(--navy-tint);border-left-color:var(--navy)}
.banner.del{background:var(--amber-tint);border-left-color:var(--amber-line)}
.banner.f360{background:var(--f360-tint);border-left-color:var(--f360)}
.dsteps{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.st{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);background:var(--surface)}
.st.done{color:var(--amber);border-color:var(--amber-line)}
.st.now{background:#B86E00;color:#fff;border-color:#B86E00}
.help{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor;font-size:11px;font-weight:700;cursor:help;position:relative;vertical-align:middle;margin-left:4px;flex:none;color:var(--blue-dark);background:transparent}
.firmcard .help{color:#1572C5}
.help .tip{display:none;position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);width:270px;background:#02324C;color:#fff;font-size:12.5px;font-weight:500;line-height:1.4;padding:10px 12px;border-radius:8px;z-index:80;text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.25);text-transform:none;letter-spacing:0;white-space:normal}
.help:hover .tip,.help:focus-visible .tip,.help.open .tip{display:block}
.help.right .tip{left:auto;right:-4px;transform:none}
.how{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 16px}
.how.one{grid-template-columns:1fr}
.howcard{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:10px;padding:12px 14px}
.howcard.del{border-top-color:var(--amber-line)}
.howcard .hh{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.flow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.flow span{background:var(--page);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12.5px;font-weight:600}
.flow i{font-style:normal;color:var(--muted)}

/* tables */
table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:10px;overflow:hidden}
th{text-align:left;color:var(--blue);font-weight:700;font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer}tr.row:hover td{background:var(--page)}
.name{font-weight:700;color:var(--blue)}
.sub{color:var(--muted);font-size:12.5px}
.rowbtns{display:flex;gap:6px;white-space:nowrap}
.rowbtns .btn{height:28px;font-size:12px;padding:0 10px}
.toolbar{display:flex;gap:12px;align-items:center;margin:0 0 10px;flex-wrap:wrap}
.toolbar input{height:34px;border:1px solid var(--line2);border-radius:999px;padding:0 14px;width:260px;background:var(--surface)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.fchip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.sect{margin:24px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sect h2{font-size:16px;color:var(--navy)}
.sect .actions{margin-left:auto}
.reviewbar{display:flex;gap:10px;align-items:center;background:var(--amber-tint);border:1px solid var(--amber-line);border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:13.5px}
.empty{padding:14px;color:var(--muted);background:var(--surface);border:1px dashed var(--line2);border-radius:10px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi .k{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi .k b{font-size:20px;display:block}
.kpi .k span{font-size:12px;color:var(--muted)}

/* cards */
.relcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--amber-line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.relcard.agg{border-left-color:var(--navy)}
.relcard.ended{opacity:.7}
.relcard .rh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.relcard .rh b{font-size:14.5px}
.relcard .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.relcard .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.group{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--f360);border-radius:10px;padding:14px;display:flex;flex-direction:column}
.group.out{border-top-color:var(--line2);background:repeating-linear-gradient(135deg,var(--surface),var(--surface) 10px,var(--page) 10px,var(--page) 20px)}
.group h3{font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.group .kind{font-size:12px;color:var(--muted);margin:2px 0 10px}
.group .firm{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:6px 8px;border-radius:6px}
.group .firm:hover{background:var(--page)}
.group .firm .t{font-size:11px;color:var(--muted);white-space:nowrap;text-align:right}
.group .firm .lnk{border:0;background:transparent;color:var(--red);font-weight:600;cursor:pointer;font-size:12px;padding:2px 4px}
.group .acts{display:flex;gap:8px;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.code{font-family:"Cascadia Code",Menlo,Consolas,monospace;font-size:12px;background:var(--chip);padding:1px 6px;border-radius:4px}

/* drawer */
.scrim{position:fixed;inset:56px 0 0 0;background:rgba(2,50,76,.35);display:none;z-index:40}
.scrim.open{display:block}
.drawer{position:fixed;top:56px;right:0;bottom:0;width:min(660px,100%);background:var(--surface);box-shadow:-8px 0 32px rgba(0,0,0,.25);transform:translateX(100%);transition:transform .22s ease;z-index:45;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer header{padding:16px 22px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.drawer header h2{font-size:18px;color:var(--navy);font-weight:700}
.drawer .body{padding:14px 22px;overflow:auto;flex:1}
.drawer footer{padding:12px 22px;border-top:1px solid var(--line);background:var(--page);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.drawer footer .ro{margin-right:auto}
.x{margin-left:auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:var(--surface);cursor:pointer;color:var(--ink);flex:none}
.sec{margin:14px 0}
.sec h3{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:center}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13.5px}.kv .k{color:var(--muted)}
.before{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.before .t{background:var(--page);border-radius:8px;padding:8px;text-align:center}
.before .n{font-size:20px;font-weight:700;color:var(--red)}
.before .l{font-size:11.5px;color:var(--muted)}
.after{display:flex;align-items:center;gap:10px;background:var(--green-tint);color:var(--green-text);border-radius:8px;padding:9px 12px;font-weight:600;margin-top:8px}
.tree{background:var(--page);border-radius:8px;padding:10px}
.tree .node{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px}
.tree .node.p{font-weight:700}.tree .node.c{margin-left:22px}
.tree .node.hit{background:var(--navy-tint)}
.tree .node .rr{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
.tree .dot{width:8px;height:8px;border-radius:50%;background:var(--line2);flex:none}.tree .hit .dot{background:var(--navy)}
.profile{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.profile.parent{border-left:4px solid var(--navy)}.profile.home,.profile.firm{border-left:4px solid var(--line2)}.profile.sa{border-left:4px solid var(--amber-line)}
.profile .ph{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.deleg{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#02324C;color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s;z-index:90;max-width:80vw;text-align:center}
.toast.show{opacity:1}

/* forms */
.seg{display:inline-flex;border:1px solid var(--navy);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 14px;font-weight:600;color:var(--navy);cursor:pointer}

.seg button.on{background:var(--navy);color:#fff}
.field{margin-bottom:12px}
.field > label{display:flex;align-items:center;font-size:12.5px;font-weight:700;margin-bottom:5px}
.input{width:100%;height:38px;border:1px solid var(--line2);border-radius:6px;padding:0 10px;background:var(--surface)}
.radio{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:6px;cursor:pointer}
.radio.on{border-color:var(--blue);background:var(--blue-tint)}
.radio.off{opacity:.6;cursor:not-allowed}
.radio .r{width:16px;height:16px;border-radius:50%;border:2px solid var(--line2);margin-top:2px;flex:none}
.radio.on .r{border-color:var(--blue);background:radial-gradient(var(--blue) 45%,transparent 50%)}
.radio .rt{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.featgrp{background:var(--page);border-radius:8px;padding:8px 12px;margin-bottom:8px}
.featgrp .g{font-weight:700;font-size:12.5px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.featgrp .g .count{margin-left:auto;background:var(--navy);color:#fff;border-radius:999px;font-size:11px;padding:1px 8px}
.feat{display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer;font-size:13.5px}
.feat.off{opacity:.45;cursor:not-allowed}
.feat .cb{width:16px;height:16px;border-radius:3px;border:1.5px solid var(--line2);display:grid;place-items:center;flex:none;background:var(--surface)}
.feat.on .cb{background:var(--navy);border-color:var(--navy);color:#fff;font-size:11px}
.feat .why{margin-left:auto;font-size:11.5px;color:var(--muted);text-align:right}
.ulist{border:1px solid var(--line2);border-radius:6px;max-height:170px;overflow:auto;background:var(--surface)}
.ulist button{display:flex;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;cursor:pointer;gap:8px;align-items:center}
.ulist button:hover{background:var(--page)}
.ulist button.on{background:var(--blue-tint)}
.check{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer}
.check.on{border-color:var(--green);background:var(--green-tint)}
.check .cb{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--line2);display:grid;place-items:center;background:var(--surface);flex:none}
.check.on .cb{background:var(--green);border-color:var(--green);color:#fff;font-size:12px}
.check .d{font-size:12px;color:var(--muted)}
.timeline .node{display:flex;gap:10px;padding:5px 0;font-size:13.5px}
.timeline .dot{width:10px;height:10px;border-radius:50%;background:var(--blue);margin-top:5px;flex:none}
.cbline{display:flex;gap:8px;align-items:center;font-size:13.5px;cursor:pointer}
.rredit{background:var(--page);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:8px}
.rredit .opts{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.rredit .opt{display:flex;gap:6px;align-items:center;cursor:pointer;font-weight:600;font-size:13px}

/* v15 · policy wording: read-only matrix, statements */
.pm-ck{display:inline-flex;width:18px;height:18px;border-radius:3px;border:1.5px solid #6B7785;background:#fff;align-items:center;justify-content:center;font-size:13px;font-weight:700;line-height:1;color:#fff;vertical-align:middle}

/* how Compass decides, and the RR codes a module receives */

/* policy by firm type; the policy and the statements are folded away so the screen is not crowded */

@media (prefers-reduced-motion:reduce){.p2-det>summary::before{transition:none}}

.p2-chip.allow,.p2-chip.deny,.p2-chip.rule{flex-basis:96px;white-space:nowrap}

/* v16 · access lines: a policy and RR code boxes on each firm, a tick grid per line */
.p3hide{display:none !important}
.fa-t td{vertical-align:top}

.p3rr{display:flex;flex-direction:column;gap:3px}
.p3rrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.p3mode{height:36px;padding:0 6px;border:1px solid var(--line2,#C7C9CB);border-radius:4px;font:inherit;font-size:13.5px;background:#fff;color:#111}
.p3rg{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:#111}
.p3code{height:36px;width:66px;box-sizing:border-box;padding:0 8px;border:1px solid var(--line2,#C7C9CB);border-radius:4px;font:inherit;font-size:14px;letter-spacing:.3px;text-transform:uppercase;background:#fff;color:#111}
.p3code:disabled,.p3mode:disabled,.p3pol:disabled{background:#F1F2F4;color:#4A5361}
.p3hint{font-size:12.5px;color:#4A5361}
.p3hint.ok{color:#1B6B36}
.p3hint.bad{color:#B3261E;font-weight:600}
.p3link{border:0;background:none;padding:4px 0;font:inherit;font-size:13px;font-weight:600;color:#0B5CAD;text-decoration:underline;cursor:pointer;text-align:left}
.p3addl{display:block;margin-top:2px}
.p3x{width:26px;height:26px;border:1px solid var(--line2,#C7C9CB);border-radius:50%;background:#fff;color:#111;font-size:11px;cursor:pointer;line-height:1}
tr.p3line td{background:#F7F9FC;border-top:1px dashed #C9D3DD}
.p3also{font-size:13px;color:#333;font-weight:600;padding-left:18px}
table.p3grid{min-width:0}

.p3hf{display:flex;align-items:center;gap:6px;font-weight:700;color:#111;font-size:13px}
.p3hf small{padding:0 6px;border-radius:3px;background:#E6EDF3;color:#02324C;font-size:10.5px;font-weight:700}
.p3hp{display:block;font-size:12px;color:#111;line-height:1.25}
.p3hr{display:block;font-size:11.5px;color:#4A5361;line-height:1.25}
table.p3grid th.p3lvh,table.p3grid td.p3lv{border-left:2px solid #9FB2C4;padding:4px 8px;white-space:nowrap}
table.p3grid td.p3gate{border-left:2px solid #9FB2C4;padding:6px 8px;text-align:center;background:#FAFBFC}
.p3s{display:inline-flex;width:22px;height:24px;align-items:center;justify-content:center;margin-right:3px;border-radius:4px;font-size:11.5px;font-weight:700;color:#333;vertical-align:middle}
.p3s:last-child{margin-right:0}
.p3s abbr{text-decoration:none}
.p3s.dash{color:#6B7785}
.p3s.lock{color:#4A5361}
.p3s input{width:17px;height:17px;margin:0;accent-color:#2170C4}
.p3s.removed{background:#FDE3E0;outline:1.5px solid #B3261E}
.p3s.waiting{background:#FFE9A8;outline:1.5px solid #8A5A00}
.p3s.waiting input{accent-color:#8A5A00}
.p3s.added{background:#CDEBD6;outline:1.5px solid #1F7A3E}

.p3legend{gap:6px 14px}
.p3k{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1.5px solid #6B7785;background:#fff}
.p3k.on{background:#2170C4;border-color:#2170C4}
.p3k.removed{background:#FDE3E0;border-color:#B3261E}

/* v16 · the panel in four steps */
.up-body.p4on{padding-top:0}
.p4bar{position:sticky;top:0;z-index:7;background:#fff;padding:12px 0 10px;border-bottom:1px solid var(--line,#DFDFDF);margin-bottom:14px}
.p4bar ol{list-style:none;margin:0;padding:0;display:flex;gap:8px;flex-wrap:wrap}
.p4bar li{flex:1 1 auto;min-width:0}
.p4step{width:100%;display:flex;align-items:center;gap:10px;padding:7px 12px;border:1px solid #C7C9CB;border-radius:24px;background:#fff;color:#2B2D31;font:inherit;cursor:pointer;text-align:left;min-height:48px}
.p4step .n{flex:0 0 24px;height:24px;border-radius:50%;background:#E6EDF3;color:#02324C;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.p4step .tx{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.p4step b{font-size:13.5px;font-weight:700;white-space:nowrap}
.p4step small{font-size:11.5px;color:#4A5361;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p4step:hover:not(.on){border-color:#02324C;background:#F3F8FE}
.p4step.on{background:#02324C;border-color:#02324C;color:#fff}
.p4step.on .n{background:#fff;color:#02324C}
.p4step.on small{color:#DCE7F1}
.p4step.bad .n{background:#FFD35C;color:#111}
.p4step.bad:not(.on){border-color:#B58900}
.up-body.p4on[data-step="1"] > [data-st]:not([data-st="1"]){display:none}
.up-body.p4on[data-step="2"] > [data-st]:not([data-st="ac"]),.up-body.p4on[data-step="3"] > [data-st]:not([data-st="ac"]){display:none}
.up-body.p4on[data-step="4"] > [data-st]:not([data-st="ac"]):not([data-st="4"]){display:none}
.up-body.p4on[data-step="2"] #p3chg,.up-body.p4on[data-step="2"] #p2sum,.up-body.p4on[data-step="2"] #p2stmts{display:none}
.up-body.p4on[data-step="3"] > [data-st="ac"] > *:not(#p2gridbox),.up-body.p4on[data-step="3"] #p2gridbox > *:not(#p3chg){display:none}
.up-body.p4on[data-step="4"] > [data-st="ac"] > *:not(#p2gridbox),.up-body.p4on[data-step="4"] #p2gridbox > *:not(#p2stmts):not(#p2sum){display:none}
.up-body.p4on[data-step="3"] > [data-st="ac"],.up-body.p4on[data-step="4"] > [data-st="ac"]{border-top:0;padding-top:0;margin-top:0}
.up-body.p4on[data-step="3"] #p3chg{margin-top:0}
.up-body.p4on[data-alone="0"] .p4scope{display:none}
.up-body.p4on[data-alone="1"]:not([data-step="1"]) .p4scope{display:none}
.up-body.p4on[data-alone="1"][data-step="1"] > [data-st="ac"]{display:block}
.up-body.p4on[data-alone="1"][data-step="1"] > [data-st="ac"] > *:not(.p4scope){display:none}
.p4fold h2{display:flex;align-items:center;gap:10px}
.p4fold[data-open="0"] > *:not(.p4fh){display:none}
.p4fold[data-open="0"]{padding-bottom:10px}
.p4tog{margin-left:auto;border:1px solid #C7C9CB;background:#fff;border-radius:16px;padding:4px 14px;font:inherit;font-size:13px;font-weight:600;color:#02324C;cursor:pointer;min-height:32px}
.up-foot .p4hide{display:none}
.up-foot .p4nav{white-space:nowrap}
.p4rev{border-top:0;padding-top:0}
.p4who{margin:6px 0 12px;font-size:14.5px;color:#111}
.p4tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:0 0 14px}
.p4tiles > div{border:1px solid var(--line2,#C9CFD6);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:1px;background:#fff}

.p4tiles span{font-size:14px;font-weight:700;color:#111}
.p4tiles small{font-size:12.5px;color:#4A5361}
.p4tiles .wait{border-color:#E0B94F;background:#FFFBEB}
.p4tiles .wait small{color:#6E5100}
table.p4lines td small{padding:0 6px;border-radius:3px;background:#E6EDF3;color:#02324C;font-size:10.5px;font-weight:700;margin-left:4px}
table.p4lines td.l{text-align:left}
.p4firms{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.p4firm{border:1px solid var(--line2,#C9CFD6);border-radius:6px;padding:12px 14px;background:#fff}
.p4firm .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.p4firm .hd b{font-size:15px;color:#111}
.p4firm .hd small{padding:0 6px;border-radius:3px;background:#E6EDF3;color:#02324C;font-size:10.5px;font-weight:700}

.up-body.p4ask #p2stmts,.up-body.p4ask #p2pol{display:none}

.uar-kpi{border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:#fff;color:#111}

.cxp.uar-st{min-width:96px;white-space:nowrap}

.uar-step.off>*:not(h3){opacity:.5}
.uar-step p{margin:0 0 8px;font-size:14px;color:#111}
.uar-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}

table.cxt.uar-creds td{padding:7px 8px}
.uar-creds input,.uar-creds select{height:34px;border:1px solid #B9C0C8;border-radius:4px;padding:0 10px;font:inherit;font-size:14px;width:100%;background:#fff;color:#111;box-sizing:border-box}
.uar-mask{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;color:#111}
.uar-pw{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;background:#F3F4F6;padding:2px 7px;border-radius:3px;color:#111}
.uar-fresh{margin:0 0 10px;padding:10px 12px;border:1px solid #9BD0AC;border-radius:6px;background:#F4FBF6;font-size:14px;color:#111;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

.uar-ta{width:100%;min-height:72px;border:1px solid #B9C0C8;border-radius:4px;padding:8px 12px;font:inherit;font-size:14.5px;color:#111;background:#fff;resize:vertical;box-sizing:border-box}
.uar-workbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 14px;border:2px solid #2170C4;border-radius:8px;background:#F3F8FE;margin-bottom:16px;font-size:14px;color:#111}
.uar-pin{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:18px;background:#fff}

.uar-toggle{display:flex;align-items:center;gap:10px;font-size:14px;color:#111;cursor:pointer}

.uar-info{margin:0 auto 18px;padding:10px 14px;border-radius:6px;background:#E8F1FB;border:1px solid #BFD7F2;color:#111;font-size:14px}

.cxp.uar-chip{min-width:0;white-space:nowrap}
#uarsec .up-f textarea{width:100%}

/* v14 additions */
.uar-s{display:inline-block;padding:3px 10px;border-radius:3px;font-size:11px;font-weight:700;letter-spacing:.3px;line-height:1.5;text-transform:uppercase;white-space:nowrap;border:1px solid transparent}
.uar-s-new{background:#FFF1CC;color:#6E5100}
.uar-s-prog{background:#2170C4;color:#fff}
.uar-s-wait{background:#EDE7F9;color:#3F2A8C;border-color:#6B4FBB}
.uar-s-hold{background:#E6E8EB;color:#333;border-color:#6B7785}
.uar-s-done{background:#1F7A3E;color:#fff}
.uar-s-rej{background:#fff;color:#B3261E;border-color:#B3261E}
.uar-s-canc{background:#fff;color:#4A5361;border:1px dashed #6B7785}
.uar-fls{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}

.uar-kpis{grid-template-columns:repeat(5,minmax(0,1fr))}

.uar-chbar{display:flex;justify-content:flex-end;margin:-6px 0 8px}
.uar-link{border:0;background:none;color:#0B5CAD;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;padding:2px 4px;text-decoration:underline}
.uar-charts{display:grid;grid-template-columns:1.15fr 1fr 1.25fr 1fr;gap:12px;margin:0 0 18px}
.uar-ch{border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:#fff;min-width:0;color:#111}
.uar-ch h3{margin:0 0 10px;font-size:13.5px;font-weight:700;color:#111}

.uar-ch p.fsd{margin:8px 0 0;font-size:11.5px;line-height:1.4}
.uar-dn{display:flex;flex-direction:column;align-items:center;gap:8px}

.uar-donut .dn{font-size:9px;font-weight:700;fill:#111}
.uar-donut .dl{font-size:3.4px;fill:#333}
.uar-leg{display:flex;flex-direction:column;gap:1px;min-width:0;width:100%}
.uar-leg .lg{display:flex;align-items:center;gap:6px;border:0;background:none;font:inherit;font-size:12px;line-height:1.35;color:#111;cursor:pointer;padding:1px 2px;text-align:left;border-radius:3px;width:100%;white-space:nowrap}
.uar-leg .lg:hover{background:#F3F4F6}
.uar-leg .lg i{width:10px;height:10px;border-radius:2px;flex:0 0 auto}
.uar-leg .lg b{margin-left:auto;font-weight:700}
.uar-hbs{display:flex;flex-direction:column;gap:7px}

.uar-hb[data-act]{cursor:pointer}
.uar-hb .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uar-hb .b{height:12px;background:#EEF0F3;border-radius:2px;overflow:hidden;display:block}
.uar-hb .b i{display:block;height:100%;border-radius:2px;min-width:2px}
.uar-hb .n{font-weight:700;text-align:right}
.uar-key{display:flex;gap:14px;font-size:12px;color:#111;margin:-4px 0 4px}
.uar-key span{display:inline-flex;align-items:center;gap:5px}
.uar-key i{width:10px;height:10px;border-radius:2px;display:inline-block}
.uar-vb{width:100%;height:auto;display:block}
.uar-vb .g{stroke:#E3E6EA;stroke-width:1}
.uar-vb .t{font-size:8.5px;fill:#333}
.uar-vb .v{font-size:8.5px;fill:#111;font-weight:700}
.uar-sel{height:40px;max-width:220px}
.uar-chips{margin:-4px 0 16px}
.pm-t.pm-ro td{height:42px;padding:3px 6px}
.pm-ck{display:inline-flex;width:18px;height:18px;border-radius:3px;border:1.5px solid #6B7785;background:#fff;align-items:center;justify-content:center;font-size:13px;font-weight:700;line-height:1;color:#fff;vertical-align:middle}
.pm-ck.on{background:#2170C4;border-color:#2170C4}
.pm-ck.na{border-style:dashed;border-color:#B9C0C8;background:#F7F8F9}
.pm-t.pm-ro td .pm-tag{margin-top:3px}
.uar-matrix .pm-legend{margin-top:2px}
.uar-files{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.uar-files li{display:flex;align-items:center;gap:10px;font-size:14px;color:#111;padding:5px 10px;border:1px solid var(--line);border-radius:4px;background:#F7F9FC}
.uar-files li a{color:#0B5CAD;font-weight:600}
.uar-files li .fsd{margin-left:auto}
.uar-files li .uar-link{font-size:13px}
.uar-card{border:1px solid var(--line2,#C9CFD6);border-radius:8px;padding:14px 16px;margin-top:12px;background:#fff}
.uar-card h3{margin:0 0 8px;font-size:15px;color:#111;display:flex;align-items:center;gap:10px}
.uar-card h3 .opt{font-size:11px;font-weight:700;background:#EEF0F3;color:#333;padding:2px 7px;border-radius:3px;letter-spacing:.3px;text-transform:uppercase}
.uar-card p{margin:0 0 8px;font-size:14px;color:#111}
.uar-card.ok{border-color:#9BD0AC;background:#F4FBF6}
.uar-card.off>*:not(h3){opacity:.55}
.uar-card .up-grid{grid-template-columns:1fr 1fr 1fr;gap:14px 18px}
.uar-hint{margin:12px 0 0;padding:8px 10px;border-radius:6px;background:#FFF8E1;border:1px solid #E0B94F;color:#111;font-size:13.5px}
.uar-apps{display:flex;flex-wrap:wrap;gap:4px 24px}
.uar-note.wait{background:#EDE7F9;border-color:#B9A8E6}
.uar-note.hold{background:#F3F4F6;border-color:#C9CFD6}
.uar-reply{margin-top:14px}
.uar-reply label{display:block;font-size:14px;color:#111;margin-bottom:6px;font-weight:600}
.uar-reply.ask{padding:12px 14px;border:2px solid #6B4FBB;border-radius:8px;background:#FAF8FE}
.uar-inc span.okc{background:#DDF1E3;color:#184F2C;font-weight:600}

.rr-add:disabled{color:#777;cursor:default;text-decoration:none}
.up-rr .rr-ed{margin-top:4px}
label.cxb{cursor:pointer}
label.cxb:focus-visible{outline:3px solid #7FB2E5;outline-offset:2px}

.pm-t.pm-ro td.pm-f,.pm-t.pm-ro td.pm-n{padding-left:16px}
.pm-t.pm-ro tr.pm-cap td{padding-left:16px}

/* v14.1 · request view: one bar on top, progress tiles, history beside the request */
.uar-main{display:flex;flex:1;min-height:0}
.uar-main .up-body{flex:1;min-width:0}
.up-head .uar-hname{font-size:15px;color:#333;font-weight:600}
.up-head .uar-histbtn{margin-left:auto;display:inline-flex;align-items:center;gap:6px}

.up-body.uar-view{padding-top:0}
.uar-cmd{position:sticky;top:0;z-index:6;margin-top:16px;background:#fff;border:1px solid #BFD7F2;border-left:5px solid #2170C4;border-radius:8px;padding:14px 16px 10px;box-shadow:0 8px 14px -12px rgba(0,0,0,.45)}
.uar-cmd.lock{border-color:#F0D58A;border-left-color:#B58900;background:#FFFBEB}

.uar-cmd-txt{flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:2px}
.uar-cmd-txt b{font-size:16px;color:#111;line-height:1.3}
.uar-cmd-txt span{font-size:13.5px;color:#333}
.uar-cmd-acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.uar-cmd-acts .cxb{white-space:nowrap}
.uar-cmd-sub{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:10px;padding-top:8px;border-top:1px solid #E5E7EB;font-size:13px;color:#111}
.uar-last{flex:1 1 200px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uar-ctl{position:relative;display:inline-flex;align-items:center;gap:6px}
.uar-own{border:1px solid var(--line2,#C9CFD6);background:#fff;border-radius:16px;padding:4px 12px;font:inherit;font-size:13px;color:#111;cursor:pointer;min-height:32px}
.uar-own:hover{border-color:#2170C4}
.uar-menu{position:absolute;top:calc(100% + 6px);right:0;z-index:20;width:340px;max-width:80vw;background:#fff;border:1px solid var(--line2,#C9CFD6);border-radius:8px;box-shadow:0 12px 28px rgba(0,0,0,.22);padding:6px;display:flex;flex-direction:column}
.uar-menu.sm{width:240px;right:auto;left:0}
.uar-menu button{display:grid;grid-template-columns:1fr auto;gap:1px 12px;align-items:center;text-align:left;border:0;background:none;font:inherit;padding:9px 10px;border-radius:6px;cursor:pointer;color:#111}
.uar-menu button:hover,.uar-menu button:focus-visible{background:#EEF4FB}
.uar-menu button b{font-size:14px;grid-column:1}
.uar-menu button>span:not(.uar-s){grid-column:1;font-size:12.5px;color:#333}
.uar-menu button .uar-s{grid-column:2;grid-row:1 / span 2}
.uar-form{margin-top:12px;padding:12px 14px;border:1px solid var(--line2,#C9CFD6);border-radius:8px;background:#F7F9FC}
.uar-form-h{font-size:14px;font-weight:700;color:#111;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.uar-form-g{display:grid;grid-template-columns:minmax(0,270px) minmax(0,1fr);gap:14px 18px}
.uar-form .uar-ta{min-height:64px}
.uar-meta.four{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:14px}
.uar-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:14px}
.uar-tile{border:1px solid var(--line2,#C9CFD6);border-radius:8px;padding:12px 14px;background:#fff;display:flex;flex-direction:column;gap:5px;min-width:0}
.uar-tile.ok{border-color:#9BD0AC;background:#F4FBF6}
.uar-tile.off>*:not(.t){opacity:.6}
.uar-tile .t{font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#333}
.uar-tile>b{font-size:15px;color:#111}
.uar-tile .d{font-size:12.5px;color:#333;line-height:1.35}
.uar-tile .uar-link{align-self:flex-start;padding:2px 0}
.uar-tile .uar-toggle{font-size:13.5px}
.uar-tile .uar-apps{gap:6px}
.uar-app{border:1px solid #6B7785;background:#fff;color:#111;border-radius:16px;padding:4px 12px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;min-height:30px}
.uar-app.on{background:#1F7A3E;border-color:#1F7A3E;color:#fff}
.uar-app:disabled{cursor:default}
.uar-app:disabled:not(.on){opacity:.6}
.uar-sofar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.uar-view>.uar-card{margin-top:14px}
.uar-hist{flex:0 0 360px;max-width:46%;border-left:1px solid var(--line);background:#FAFBFC;overflow:auto;padding:16px 18px 24px}

.uar-hist .uar-tl li{grid-template-columns:1fr;gap:2px;padding:9px 0}
.uar-hist .uar-ta{min-height:58px}
.uar-cmd .uar-reply{margin-top:12px}
.uar-matrix>.uar-link{margin-top:8px}
@media (max-width:900px){.uar-hist{position:absolute;right:0;top:0;bottom:0;max-width:92%;box-shadow:-8px 0 24px rgba(0,0,0,.2);z-index:8}.uar-main{position:relative}.uar-form-g{grid-template-columns:1fr}.uar-meta.four{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* v14.2 · help for the SAA team: workflow map and first-time tour */
#uartourbtn,#uarmapbtn{display:inline-flex;align-items:center;gap:6px}
dialog.uar-map{width:min(1040px,94vw);max-height:92vh;border:0;border-radius:10px;padding:0;color:#111;font-family:inherit;box-shadow:0 24px 60px rgba(0,0,0,.4);overflow:hidden}

.um-svg .ns{font-size:11.5px;fill:#333}
.um-svg .al{font-size:12.5px;fill:#111}
.um-svg .pl{font-size:10.5px;font-weight:700;letter-spacing:.3px}

.um-steps{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.um-steps li{border:1px solid var(--line2,#C9CFD6);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:#fff}
.um-steps .n{display:inline-flex;width:24px;height:24px;border-radius:50%;background:#02324C;color:#fff;font-size:12.5px;font-weight:700;align-items:center;justify-content:center}

/* ===================== preview: what the person sees after one sign-in ===================== */
function pvScope(p, pr){ /* list of {code, firm, via} sample accounts for a profile */
  const out = [];
  if (pr.kind === 'sa') pr.delegations.forEach(id => { const d = dl(id); if (!d || d.status !== 'ACTIVE') return; const sc = pr.dscope && pr.dscope[id] ? pr.dscope[id] : d.rr; const r = parseRange(sc) || parseRange(d.rr); const n = r ? r[0] + 2 : 1000; out.push({code:FIRMS[d.from].rr + ' ' + n, firm:d.from, via:'del', d}); });
  else Object.entries(pr.rr || {}).forEach(([f, v]) => { const r = v === 'all' ? null : parseRange(v); const n = r ? r[0] + 1 : parseInt(((FIRMS[f].rr === 'HF') ? 1005 : FIRMS[f].rr === 'KJ' ? 2004 : FIRMS[f].rr === 'RB' ? 3003 : FIRMS[f].rr === 'WC' ? 4002 : FIRMS[f].rr === 'HB' ? 5004 : FIRMS[f].rr === 'GP' ? 7005 : 1005)); out.push({code:FIRMS[f].rr + ' ' + n, firm:f, via:pr.kind === 'parent' ? 'agg' : 'own'}); });
  return out; }
function pvFeatures(pr){ /* features the profile can actually use, with reasons */
  if (pr.kind === 'sa') { const lenders = pr.delegations.map(dl).filter(d => d && d.status === 'ACTIVE').map(d => d.from); return pr.features.map(k => ({k, ok: availIn(k, lenders).length > 0, why: availIn(k, lenders).length ? '' : 'none of the owning firms subscribes'})); }
  const firms = pr.kind === 'parent' ? Object.keys(pr.rr || {}) : [pr.firm];
  return pr.features.map(k => { const av = availIn(k, firms); const fo = pr.kind === 'parent' && FIRM_ONLY.includes(k); return {k, ok: av.length > 0 && !fo, why: fo ? 'firm-only app' : av.length === 0 ? 'no subscribed firm' : av.length < firms.length ? 'in ' + av.length + ' of ' + firms.length + ' firms' : ''}; }); }
function openPreview(pid){ PV = PV && PV.pid === pid ? PV : {pid, idx:0, acct:null, action:'ord'}; renderPreview(); }
function renderPreview(){ const p = byId(PV.pid); const prs = p.profiles; if (PV.idx >= prs.length) PV.idx = 0; const pr = prs[PV.idx];
  const feats = pvFeatures(pr); const scope = pvScope(p, pr);
  /* account options: all profiles’ scopes + two out-of-scope samples */
  const all = prs.flatMap((x, i) => pvScope(p, x).map(a => Object.assign({pi:i}, a)));
  const extra = [{code:(ACCOUNTS.find(a => a.firm === 'cpw') || {id:firmId('cpw')}).id, firm:'cpw', via:'none', pi:-1}, pr.kind === 'sa' && scope[0] ? {code:(ACCOUNTS.find(a => a.firm === scope[0].firm && !inSlice(a.rrn, (pr.dscope && scope[0].d && pr.dscope[scope[0].d.id]) || (scope[0].d && scope[0].d.rr) || 'all')) || {id:firmId(scope[0].firm) + '-OUT'}).id, firm:scope[0].firm, via:'outside', pi:-1} : {code:(ACCOUNTS.find(a => a.firm === 'dundee') || {id:firmId('dundee')}).id, firm:'dundee', via:'none', pi:-1}];
  const opts = all.concat(extra); if (!PV.acct || !opts.some(o => o.code === PV.acct)) PV.acct = opts[0] ? opts[0].code : null;
  const acct = opts.find(o => o.code === PV.acct);
  const actions = [['ord','Place an order (Orders)'],['cli','Open the client profile'],['svc','Move money (Servicing)'],['res','Open Research'],['xfer','Submit a transfer'],['onb','Open an account (Onboarding)']];
  /* evaluate */
  const ev = []; let ok = true;
  if (acct) {
    const inThis = pr.kind === 'sa' ? scope.some(s => s.firm === acct.firm && acct.via !== 'outside') : Object.keys(pr.rr || {}).includes(acct.firm) && (acct.via !== 'outside');
    if (inThis) ev.push(['ok', `${acct.code} is in this profile’s accounts`]); else { ok = false; const other = prs.findIndex((x, i) => i !== PV.idx && pvScope(p, x).some(s => s.firm === acct.firm)); ev.push(['no', `${acct.code} is not in this profile’s accounts${other >= 0 ? ' — switch to the ' + (prs[other].kind === 'sa' ? 'delegated-accounts' : 'home') + ' profile' : acct.via === 'outside' ? ' — outside the delegated slice' : ' — no profile reaches ' + fname(acct.firm)}`]); }
    const has = pr.features.includes(PV.action); if (has) ev.push(['ok', `${FEAT[PV.action]} is in this profile`]); else { ok = false; ev.push(['no', `${FEAT[PV.action]} is not in this profile`]); }
    if (pr.kind === 'sa') { if (TRADING_ONLY.includes(PV.action) || (pr.referral && VIEW_ONLY.includes(PV.action))) ev.push(['ok', `allowed by the ${pr.referral ? 'referral' : 'sub-advisory'} bundle`]); else { ok = false; ev.push(['no', `not in the ${pr.referral ? 'referral' : 'sub-advisory'} bundle`]); } }

/* ===================== End-user preview ===================== */
function profileScope(pr){ if (pr.kind === 'sa') { const out = {}; pr.delegations.forEach(id => { const d = dl(id); if (d && d.status === 'ACTIVE') out[d.from] = (pr.dscope && pr.dscope[id]) || d.rr; }); return out; } if (pr.kind === 'parent') return Object.assign({}, pr.rr || {}); return {[pr.firm]: (pr.rr && pr.rr[pr.firm]) || 'all'}; }
function inSlice(n, slice){ if (!slice || slice === 'all') return true; const rs = [...String(slice).matchAll(/(\d+)(?:\s*[–-]\s*(\d+))?/g)].map(m => [+m[1], m[2] ? +m[2] : +m[1]]); return rs.length === 0 || rs.some(([a, b]) => n >= a && n <= b); }
function pvRows(src){ const p = byId(PVX.pid); const pr = p.profiles[PVX.idx]; const sc = profileScope(pr); const firms = Object.keys(sc).filter(f => PVX.ctx === 'all' || f === PVX.ctx); return src.filter(a => firms.includes(a.firm) && inSlice(a.rrn, sc[a.firm])); }
function enterPreview(pid, idx, scr){ const p = byId(pid); if (!p || !p.profiles.length) return toast('No profile to preview.'); mode = 'preview'; PVX = {pid, idx: idx || 0, ctx:'all', screen: scr || 'pvaccounts'}; if (typeof NAVOPEN !== 'undefined') NAVOPEN = {}; closeDrawer(); render(); }
function pvHead(title, note){ const p = byId(PVX.pid); const prs = p.profiles; const pr = prs[PVX.idx]; const sc = profileScope(pr); const firms = Object.keys(sc);
  const switcher = prs.length > 1 ? `<div class="pvseg" id="pvprof"><span class="fsd">Profile</span>${prs.map((x, i) => `<button class="seg${i === PVX.idx ? ' on' : ''}" data-act="pvprofx" data-id="${i}">${x.kind === 'sa' ? (x.referral ? 'Referral partner' : 'Delegated accounts') : x.kind === 'parent' ? esc(fname(x.firm)) : (x.kind === 'firm' ? 'Firm · ' : 'Home · ') + esc(fname(x.firm))}</button>`).join('')}${tagNew('SWITCHER')}</div>` : '';
  const ctx = pr.kind === 'parent' ? `<div class="pvseg" id="pvctx"><label for="pvctxsel" class="fsd">Firm context</label><select id="pvctxsel" class="cxsel sm" data-act="pvctx"><option value="all"${PVX.ctx === 'all' ? ' selected' : ''}>All firms (aggregate)</option>${firms.map(f => `<option value="${f}"${PVX.ctx === f ? ' selected' : ''}>${esc(fname(f))}</option>`).join('')}</select>${tagP2('DEMO · NOT IN INCREMENT 1')}</div>` : '';
  return `<div class="pvhead"><div><h1>${title}</h1><p class="sub">${note || ''}</p></div><div class="pvctl">${switcher}${ctx}${cxbtn('Access check', 'grey', 'eye', 'preview', p.id)}</div></div>`; }
function scrPvAccounts(){ const rows = pvRows(ACCOUNTS); const p = byId(PVX.pid); const pr = p.profiles[PVX.idx];
  const byClient = {}; rows.forEach(a => (byClient[a.client] = byClient[a.client] || []).push(a));
  const body = Object.keys(byClient).slice(0, 40).map(c => { const as = byClient[c]; const first = as[0]; return `<tr class="cl"><td><span class="chev">${ico('chev', 16, '#333', 2.2)}</span><b>${esc(first.id.slice(0, -1))}</b> <a href="#" data-act="noop"><b>${esc(c)}</b></a> ${ico('info', 14, '#1B6AC2', 2)}</td><td>Age: ${first.age}</td><td><span class="fsd">${esc(fname(first.firm))}</span></td><td></td></tr>` + as.map(a => `<tr class="ac"><td class="in"><a href="#" data-act="noop"><b>${esc(a.id)}</b></a> ${ico('flag', 14, '#B3261E', 2)} ${esc(a.type)} ${ico('info', 14, '#1B6AC2', 2)}</td><td></td><td><span class="fsd">${esc(fname(a.firm))}</span></td><td>${esc(a.rr)}</td></tr>`).join(''); }).join('');
  return pvHead('Accounts', pr.kind === 'sa' ? 'Delegated accounts only: the slice each owning firm lent, nothing else.' : pr.kind === 'parent' ? 'Every account in the firms this person reaches, with the firm it belongs to. One list, no switching.' : 'Accounts of ' + esc(fname(pr.firm)) + ' in this profile’s RR codes.') +
    cxbanner(`Too many accounts found, showing a max of 10,000. Use search or filter to find relevant accounts among all accounts`) + `<div class="cxtools">${searchBox('Search by Account Number or Client Name', 'asearch')}${cxbtn('Filters', 'grey', 'filter')}<span class="grow"></span><span>Sort</span><select class="cxsel sm" aria-label="Sort"><option>Client Last Updated</option></select></div>
    <table class="cxt accts"><thead><tr><th>Account</th><th></th><th>Firm ${tagNew()}</th><th>Representative (RR / IA Code)</th></tr></thead><tbody>${body || '<tr><td colspan="4" class="fsd">No accounts in this profile.</td></tr>'}</tbody></table>

function scrPvOrders(){ const p = byId(PVX.pid); const pr = p.profiles[PVX.idx]; if (!pmod(pr, 'Trading: Orders')) return pvHead('Orders', '') + cxbanner('Orders is not in this profile. ' + (p.profiles.some(x => x.kind === 'sa') ? 'Switch to the delegated-accounts profile to trade.' : 'Ask the ID Admin team to add it.'), 'warn');
  const rows = pvRows(ORDERS); const sk = s => s === 'FILLED' ? 'green' : s === 'CANCELLED' ? 'grey' : 'amber';

function scrPvTA(){ const p = byId(PVX.pid); const pr = p.profiles[PVX.idx]; const sc = profileScope(pr); const firms = Object.keys(sc);

/* ---------- dashboard ---------- */
function visible(){ let l = UAR.slice(); if (persona === 'fss') { const sc = scopeOf(me); l = l.filter(r => sc.includes(r.ctx)); } return l; }
function listFor(){ let l = visible(); const s = UF.status;
  if (s === 'open') l = l.filter(isOpen); else if (s === 'waiting') l = l.filter(r => r.status === 'Waiting on steward' || r.status === 'On hold'); else if (s === 'over') l = l.filter(over48); else if (s !== 'all') l = l.filter(r => r.status === s);
  if (UF.mine && persona === 'saa') l = l.filter(r => r.owner === SAA_ME);
  if (UF.type !== 'all') l = l.filter(r => r.type === UF.type);
  if (UF.firm !== 'all') l = l.filter(r => groupOf(r.ctx) === UF.firm);
  const q = UF.q.toLowerCase().trim(); if (q) l = l.filter(r => (r.id + ' ' + pname(r) + ' ' + (r.person.email || '') + ' ' + r.by.name + ' ' + fname(r.ctx) + ' ' + firmsTxt(r) + ' ' + TYPE[r.type] + ' ' + r.status + ' ' + (r.reason || '') + ' ' + (r.owner || '')).toLowerCase().includes(q));
  return l.sort((a, b) => UF.sort === 'old' ? a.submitted - b.submitted : UF.sort === 'eff' ? (a.effective || '9999').localeCompare(b.effective || '9999') : b.submitted - a.submitted); }
function flags(r){ const o = []; if (urgent(r)) o.push('<span class="uar-fl red" title="A leaver: remove access quickly">Urgent</span>'); if (r.reopened) o.push('<span class="uar-fl" title="Reopened by the steward">Reopened</span>'); if (r.files && r.files.length) o.push(`<span class="uar-fl plain" title="Documents attached">${r.files.length} doc${r.files.length === 1 ? '' : 's'}</span>`); if (r.creds.length) o.push('<span class="uar-fl plain" title="Credentials returned">Credentials</span>'); return o.length ? `<div class="uar-fls">${o.join('')}</div>` : ''; }
function rowsHtml(l){ if (!l.length) return `<tr><td colspan="10" class="fsd">No requests match. Change the filters${persona === 'fss' ? ', or start one with New request' : ''}.</td></tr>`;
  return l.map(r => { const dq = due(r); return `<tr class="row" data-act="uaropen" data-id="${r.id}" tabindex="0"><td class="rid">${r.id}${flags(r)}</td><td>${TYPE[r.type]}</td><td><div class="name">${esc(pname(r))}</div><div class="sub">${esc(r.person.email || '')}</div></td><td>${esc(firmsTxt(r))}<div class="sub">${esc(fname(groupOf(r.ctx)))}</div></td><td>${sPill(r.status)}${r.reason && r.status !== 'Completed' ? `<div class="sub">${esc(r.reason)}</div>` : ''}</td><td>${esc(r.by.name)}<div class="sub">${esc(ctxLabel(r.by.firm))}</div></td><td class="${persona === 'saa' && r.owner === SAA_ME ? 'uar-own' : ''}">${r.owner ? esc(r.owner) : '<span class="fsd">SAA team</span>'}</td><td>${esc(effShort(r.effective))}${dq ? `<div class="uar-over">${dq}</div>` : ''}</td><td>${dTime(r.submitted)}</td><td class="${over48(r) ? 'uar-over' : ''}">${age(r)}${over48(r) ? ' · over 48 h' : ''}</td></tr>`; }).join(''); }

function donut(parts){ const tot = parts.reduce((s, p) => s + p.n, 0) || 1; let off = 25;
  const segs = parts.filter(p => p.n).map(p => { const v = p.n / tot * 100; const s = `<circle cx="21" cy="21" r="15.915" fill="none" stroke="${p.c}" stroke-width="7" stroke-dasharray="${v.toFixed(2)} ${(100 - v).toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"><title>${esc(p.l)}: ${p.n}</title></circle>`; off -= v; return s; }).join('');
  return `<svg viewBox="0 0 42 42" class="uar-donut" role="img" aria-label="Requests by status: ${esc(parts.map(p => p.l + ' ' + p.n).join(', '))}">${segs}<text x="21" y="21.5" text-anchor="middle" class="dn">${parts.reduce((s, p) => s + p.n, 0)}</text><text x="21" y="26.5" text-anchor="middle" class="dl">requests</text></svg>`; }
function hbars(rows){ const mx = Math.max(1, ...rows.map(r => r.n)); return `<div class="uar-hbs">${rows.map(r => `<div class="uar-hb"${r.act ? ` data-act="${r.act}" data-id="${esc(r.id)}" tabindex="0" role="button"` : ''}><span class="l">${esc(r.l)}</span><span class="b"><i style="width:${Math.round(r.n / mx * 100)}%;background:${r.c}"></i></span><span class="n">${r.n}</span></div>`).join('')}</div>`; }
function vbars(days){ const mx = Math.max(1, ...days.map(d => Math.max(d.a, d.b))); const W = 300, H = 132, x0 = 22, bw = 13, step = (W - x0 - 6) / days.length, base = 106, sc = 84 / mx;

  const bars = days.map((d, i) => { const x = x0 + i * step + (step - bw * 2 - 2) / 2; return `<rect x="${x.toFixed(1)}" y="${(base - d.a * sc).toFixed(1)}" width="${bw}" height="${(d.a * sc).toFixed(1)}" fill="#2170C4"><title>${d.l}: ${d.a} received</title></rect><rect x="${(x + bw + 2).toFixed(1)}" y="${(base - d.b * sc).toFixed(1)}" width="${bw}" height="${(d.b * sc).toFixed(1)}" fill="#1F7A3E"><title>${d.l}: ${d.b} closed</title></rect>${d.a ? `<text x="${(x + bw / 2).toFixed(1)}" y="${(base - d.a * sc - 3).toFixed(1)}" text-anchor="middle" class="v">${d.a}</text>` : ''}${d.b ? `<text x="${(x + bw * 1.5 + 2).toFixed(1)}" y="${(base - d.b * sc - 3).toFixed(1)}" text-anchor="middle" class="v">${d.b}</text>` : ''}<text x="${(x + bw + 1).toFixed(1)}" y="${base + 14}" text-anchor="middle" class="t">${d.l}</text>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="uar-vb" role="img" aria-label="Requests received and closed per day: ${esc(days.map(d => d.l + ' ' + d.a + ' in, ' + d.b + ' closed').join('; '))}">${grid}${bars}</svg>`; }
